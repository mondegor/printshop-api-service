get:
  summary: Метод получения списка мест хранения
  description: |-
    Метод предназначен для получения списка всех мест хранения текущего аккаунта, сохраненных в БД

    ### Пагинация
    Первая страница запрашивается без `cursor`. Следующая — с `cursor` из предыдущего ответа,
    пока `has_next` равен `true`. Некорректные `cursor` и `limit` не приводят к ошибке:
    - некорректный `cursor` — возвращается первая страница;
    - `limit` равен 0 — используется размер по умолчанию, `limit` больше максимума — максимум;
      `cursor` при этом учитывается;
    - неразбираемый `limit` (не число, отрицательное) — первая страница размера по умолчанию,
      `cursor` при этом не учитывается.

  operationId: getStoreList
  tags:
    - Warehousing.Store

  parameters:
#    - $ref: "../../_shared/components/parameters/Api.Request.Header.AcceptLanguage.yaml"
#    - $ref: "../../_shared/components/parameters/Api.Request.Header.CorrelationID.yaml"
#    - $ref: "../../_shared/components/parameters/Api.Request.Query.Language.yaml"
    - $ref: "../components/parameters/Warehousing.Stores.Request.Query.Filter.SearchCode.yaml"
    - $ref: "../components/parameters/Warehousing.Request.Query.Filter.TerritoryIDs.yaml"
    - $ref: "../../_shared/components/parameters/Api.Request.Query.ListCursor.Cursor.yaml"
    - $ref: "../../_shared/components/parameters/Api.Request.Query.ListCursor.Limit.yaml"

  responses:
    "200":
      description: Получен список мест хранения
      content:
        application/json;charset=UTF-8:
          schema:
            $ref: "../components/models/Warehousing.Stores.Response.Model.StoreList.yaml"
    "401":
      $ref: "../../_shared/components/responses/Api.ResponseJson.Error401.yaml"
    "403":
      $ref: "../../_shared/components/responses/Api.ResponseJson.Error403.yaml"
    "500":
      $ref: "../../_shared/components/responses/Api.ResponseJson.Error5xx.yaml"
