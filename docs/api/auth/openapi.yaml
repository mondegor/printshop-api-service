openapi: 3.0.3
info:
  version: LATEST
  title: Auth API
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: |-
    Auth REST API
    - При создании нового аккаунта, пользователь, в качестве логина должен указать свой емаил, на который будет отправлен код, для подтверждения емаила и активации аккаунта;
    - Для последующего входа пользователем в систему, ему нужно указать свой емаил/телефон и далее ввести код подтверждения отправленный на его емаил. При включенной 2FA ему дополнительно нужно будет ввести пароль/TOTP код от своей учётной записи (либо один из одноразовых аварийных кодов);
    - Пользователь с включённой 2FA, утративший доступ к почте, может войти и сменить емаил без кода из письма — комбинацией «пароль/TOTP + аварийный код» (методы `.../recovery`);
    - Авторизованный пользователь может:
      - включить 2FA аутентификацию, выбрав один из способов дополнительной проверки: по паролю или по TOTP коду;
      - отключить 2FA аутентификацию введя код с емаила и пароль/TOTP код (или вместо него одноразовый аварийный код, выданный при включении 2FA либо при перевыпуске кодов);
      - перевыпустить одноразовые аварийные коды;
      - изменить свой емаил — с подтверждением владения и аккаунтом, и новым адресом;
      - установить/изменить свой телефон — с подтверждением владения аккаунтом (код на текущий емаил); сам номер кодом не проверяется;
      - следить за всеми своими открытыми сессиями и закрыть любую из них при необходимости;
      - осуществлять особые операции требующие дополнительного подтверждения по емаилу или 2FA методами;

    Методы `Auth.Security` сессии и токены не затрагивают: текущая сессия сохраняется, refresh токен
    не ротируется, остальные открытые сессии не закрываются, повторный вход не требуется — изменения
    видны в профиле (`GET /v1/user`). Закрыть прочие сессии, например после смены
    второго фактора или адреса, пользователь при желании может сам — `GET /v1/sessions`
    и `POST /v1/sessions/close`.

    Включение или отключение 2FA отзывает **все** незавершённые операции пользователя — в том числе
    начатые вход, смену емаила или телефона: их цепочки подтверждения построены при прежнем
    состоянии 2FA. Такие операции нужно начать заново, их токены отвечают `OperationInvalid`.

    ### Аутентификация и доступ
    По умолчанию к методу применяется схема `bearerAuth` — заголовок `Authorization: Bearer <accessToken>`, объявленный в корневом `security`. Метод, которому токен не обязателен, отключает её собственным `security: []`.
    Расширение `x-auth-scopes` описывает, **кому метод предназначен**:
    - `guests-only` — только **неавторизованному** посетителю; сопровождается `security: []`, токен не требуется;
    - `any-users` — **любому авторизованному** пользователю, без ограничения по ролям; действует корневой `bearerAuth`, токен обязателен;
    - расширение **отсутствует** (при `security: []`) — метод доступен **и гостю, и авторизованному**: право на действие даёт не токен, а секрет в самом запросе (токен операции, refreshToken) либо метод публичен. Признак категории — именно допустимость авторизованного вызывающего, а не источник права: `POST /v1/session` тоже принимает токен операции, но остаётся `guests-only`, потому что открывать сессию уже авторизованному нельзя;

    Отсюда правило по кодам отказа:
    - `401` — негоден предъявленный **сессионный** токен: access-токен не предъявлен, неизвестен или истёк (методы `any-users`), либо refresh-токен неизвестен, истёк или уже использован (`PATCH /v1/session`, где право на действие даёт сам refresh-токен, а не схема). Отказ исправим: клиент продлевает сессию, а если продлить не удалось — входит заново. Тело ответа кода ошибки не несёт;
    - `403` — вызывающему это действие не разрешено: авторизованный пользователь обратился к `guests-only`-методу, пользоваться которым он не может, либо запрос отклонён принадлежностью или типом объекта, либо предъявленный access-токен не разрешён текущему контуру, либо access-токен не разобрался структурно (битая подпись, неизвестный идентификатор ключа, несовпадение алгоритма) — такой токен заведомо не выдавался сервером, поэтому продление сессии здесь не поможет;
    - `404` — запрошенный ресурс не существует в этом развёртывании. Причина отказа перечислена в описании метода;
    - `409` — запрос корректен и вызывающему разрешён, но отклонён **текущим состоянием ресурса**: требуемое действие в этом состоянии не имеет смысла. Повторять тот же запрос бессмысленно, пока состояние не изменится. Причина отказа однозначно задана самим методом и перечислена в его описании;
    - `422` — тело запроса не удалось разобрать: невалидный JSON, значение поля не того типа либо в теле присутствует **неизвестное поле** (лишние поля отклоняются). Разбор обрывается **до** проверки схемы JSON. Повторять тот же запрос бессмысленно — причина в самом клиенте, а не в состоянии сервера. Возможен у **любого** метода, принимающего тело запроса;
    - `429` — запрос корректен, но отклонён **временно**: анти-спам троттл или исчерпанный ресурс сервера. Повторить следует тот же запрос через время из заголовка `Retry-After`; заголовок необязателен — если сервер не берётся назвать срок, клиент выбирает паузу сам. Причина отказа однозначно задана самим методом и перечислена в его описании;

    ### Общие параметры запросов
    Перечисленные ниже параметры необязательны и принимаются **всеми методами** API, поэтому у каждого метода отдельно не перечисляются:
    - `Accept-Language` (заголовок) / `lang` (query-параметр) — предпочтительный язык пользователя;
    - `X-Accept-Time-Zone` (заголовок) / `tz` (query-параметр) — предпочтительный часовой пояс пользователя;
    - `X-Correlation-Id` (заголовок) — уникальный идентификатор клиента для сквозной трассировки запроса.

    Ни один из этих параметров **не может стать причиной отказа**: невалидное или неподдерживаемое значение
    молча игнорируется — для языка и часового пояса применяется следующий источник по приоритету, — поэтому
    кода ошибки по ним не бывает ни у одного метода.

    Исключение — `POST /v1/signup` и `POST /v1/user/settings`: там язык и часовой пояс не только применяются
    к самому ответу, но и сохраняются в профиль пользователя, поэтому у этих двух методов они объявлены явно.

    Приоритет применения языка и часового пояса описан ниже в разделе «Локализация и время».

    ### Локализация и время
    - Все сущностные даты/время в ответах отдаются в **часовом поясе пользователя** в формате RFC3339 со смещением (например `2020-01-01T15:00:00+03:00`);
    - Текстовые сообщения (`message`) и уведомления отдаются на **языке пользователя**;
    - **Язык** и **часовой пояс** определяются по одному и тому же приоритету источников и авторизации не требуют — оба применяются в том числе к гостевым запросам:
      1. query-параметр запроса — `lang` (например `ru-RU`) / `tz` (например `Europe/Moscow`) — наивысший приоритет, разовое переопределение на конкретный запрос;
      2. access-токен — для **авторизованных** запросов сервер подставляет язык и пояс, зафиксированные в токене на момент его выпуска. Задать их можно при регистрации (`POST /v1/signup`) и изменить позже (`POST /v1/user/settings`);
      3. заголовок клиента — `Accept-Language` (список с весами `q`) / `X-Accept-Time-Zone` (например `Europe/Moscow;offset=+03:00;dst=0`);
      4. значение по умолчанию — язык и часовой пояс системы;
    - Первые два источника **строгие**: значение принимается, только если оно точно совпадает с поддерживаемым приложением (`?lang=fr-CH` при поддержке `fr` совпадением не считается). Заголовок клиента разбирается терпимее — по нему подбирается ближайшее поддерживаемое значение: у языка по тегам, у пояса по параметрам `offset` и `dst`, когда его имя приложению неизвестно;
    - Невалидное значение источника пропускается — применяется следующий по приоритету;
    - Изменённые через `POST /v1/user/settings` язык и часовой пояс применяются к ответам **только после ближайшего продления сессии** (`PATCH /v1/session`), которое клиент выполняет штатно для поддержания активности сессии, — **повторный вход не требуется**. Верхняя граница окна рассинхрона — остаток времени жизни текущего access-токена (`expires_in` из ответа на открытие/продление сессии); до продления сервер продолжает отвечать в прежнем языке и поясе. Поля `lang` и `tz` в `GET /v1/user` читаются из профиля, то есть отдают уже новые значения, поэтому в этом окне они могут не совпадать с языком и поясом, применёнными к тому же ответу. Применить новые значения к конкретному ответу, не дожидаясь продления сессии, можно параметрами `lang` и `tz`;
    - Время **возникновения ошибки** (`time` в объектах ошибок) — это системное время и всегда отдаётся в **UTC**, независимо от часового пояса пользователя.

    ### Ограничения полей и ошибки `400`

    #### Ограничения полей
    - required - поле обязательно для заполнения;
    - min=N - поле должно быть не менее N символов;
    - max=N - поле должно быть не более N символов;
    - enum - поле должно содержать одно из ENUM значений;

    #### Значения `code` в ответе `400`
    Ответ `400` содержит список `errors`, у каждого элемента которого есть `code`
    (см. `Api.Response.Model.ErrorAttribute`). Значение `code` принимает одну из двух форм:
    - `ErrorCode` — запрос отклонён по существу, ошибка не относится к конкретному полю запроса;
    - `ErrorCode/field_name` — ошибка относится к значению поля запроса. Суффикс после первого `/`
      совпадает с именем поля в JSON, префикс задаёт причину отказа.

    Ошибки проверки схемы (обязательность, длина, формат) приходят с префиксом `ValidateError`,
    то есть как `ValidateError/field_name`, и возможны для любого поля, объявленного в схеме запроса.
    Значения, возможные у конкретного метода, перечислены в его собственном описании.
servers:
  - url: http://api.sample.local/auth
    description: Local Domain
  - url: http://localhost:8080/auth
    description: Local Host
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Auth API
  - name: Auth.Check
    description: Auth API Helps to check user data
  - name: Auth.Operation
    description: Auth API Confirmation operations
  - name: Auth.Security
    description: Auth API User security methods change protected user properties
  - name: Auth.Sessions
    description: Auth API User Sessions
paths:
  /v1/signup:
    post:
      summary: Auth/R1. Метод создания нового пользователя в системе
      description: |-
        Метод предназначен для подготовки создания в БД системы новой учётной записи пользователя.

        ### Алгоритм создания нового пользователя:
        1. Пользователь указывает свой емаил в качестве логина;
        2. Отправляется код подтверждения на указанный емаил;
        3. Пользователь указывает полученный код и подтверждает регистрацию своего аккаунта;
        4. Создаётся аккаунт пользователя;
        5. Пользователь получает доступ к своему аккаунту;

        Язык и часовой пояс в теле запроса не передаются: они определяются по самому запросу
        (query-параметры `lang`/`tz`, затем заголовки `Accept-Language`/`X-Accept-Time-Zone`,
        затем значения приложения по умолчанию) и фиксируются на этом шаге, поэтому аккаунт
        создаётся с теми же настройками, с какими шла регистрация, даже если подтверждение кода
        придёт позже и из другого окружения. Изменить их потом можно через
        `POST /v1/user/settings`.

        ### Значения `code` в ответе `400`
        - `ValidateError/realm` / `ValidateError/user_email` — поле не указано или не проходит
          проверку схемы (в т.ч. когда realm не входит в список realm'ов приложения, а емаил
          не является адресом);
        - `EmailAlreadyExists/user_email` — емаил уже занят другим пользователем;

        ### Причины ответа `403`
        - метод гостевой: запрос выполнен с действующим access-токеном, то есть вызывающий уже
          авторизован и регистрировать нового пользователя ему нельзя;

        ### Причины ответа `429`
        - по этому емаилу уже идёт регистрация (код подтверждения отправлен недавно): анти-спам
          троттл. Попытку следует повторить через время из заголовка `Retry-After` — не раньше,
          чем истечёт срок жизни уже созданной операции регистрации;
      operationId: createUser
      tags:
        - Auth
      x-auth-scopes:
        - guests-only
      security: []
      parameters:
        - $ref: '#/components/parameters/Api.Request.Header.AcceptLanguage'
        - $ref: '#/components/parameters/Api.Request.Header.AcceptTimeZone'
        - $ref: '#/components/parameters/Api.Request.Query.Language'
        - $ref: '#/components/parameters/Api.Request.Query.TimeZone'
      requestBody:
        required: true
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/Auth.Request.Model.CreateUser'
      responses:
        '200':
          $ref: '#/components/responses/Auth.ResponseJson.WaitingConfirmOperation'
        '400':
          $ref: '#/components/responses/Api.ResponseJson.Error400'
        '403':
          $ref: '#/components/responses/Api.ResponseJson.Error403'
        '422':
          $ref: '#/components/responses/Api.ResponseJson.Error422'
        '429':
          $ref: '#/components/responses/Api.ResponseJson.Error429'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/signin:
    post:
      summary: Auth/R2a. Метод авторизации пользователя в системе
      description: |-
        Метод предназначен для авторизации пользователя под указанным емаилом/телефоном.

        ### Алгоритм авторизации пользователя:
        1. Пользователь указывает свой емаил/телефон в качестве логина;
        2. Отправляется код подтверждения на указанный емаил или на емаил привязанный к указанному телефону;
        3. Пользователь указывает полученный код и подтверждает авторизацию;
        4. Если 2FA включена:\
          4.1. Пользователю предлагается ввести пароль или TOTP код;\
          4.2. Пользователь указывает его и получает доступ к своему аккаунту;
        5. Если 2FA выключена:\
          5.1. Пользователь получает доступ к своему аккаунту;

        Вход принимает три комбинации доказательств: «код с емаила + пароль/TOTP»,
        «код с емаила + аварийный код» и «пароль/TOTP + аварийный код». Первые две обслуживает этот
        метод: на шаге 4.1 в поле `secret` вводится пароль/TOTP код **либо** один из одноразовых
        аварийных кодов, объявлять выбор заранее не нужно. Третья комбинация — для утративших доступ
        к почте, её создаёт отдельный метод `POST /v1/signin/recovery`.

        За один вход расходуется не более одного аварийного кода: предъявить его можно только
        на последнем звене цепочки. Аварийные коды выдаются при включении 2FA и при их перевыпуске.

        До первого успешного доказательства ответы метода подтверждения одинаковы для аккаунтов
        с включённой и выключенной 2FA: по ним нельзя определить состояние аккаунта. То же верно
        и для `POST /v1/signin/recovery`.

        ### Значения `code` в ответе `400`
        - `ValidateError/realm` / `ValidateError/user_login` — поле не указано или не проходит
          проверку схемы (в т.ч. когда realm не входит в список realm'ов приложения, а логин
          не является емаилом/телефоном);
        - `LoginNotExists/user_login` — пользователя с таким логином нет;

        ### Причины ответа `403`
        - метод гостевой: запрос выполнен с действующим access-токеном, то есть вызывающий уже
          авторизован и повторно авторизовываться ему нельзя;
      operationId: authorizeUser
      tags:
        - Auth
      x-auth-scopes:
        - guests-only
      security: []
      requestBody:
        required: true
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/Auth.Request.Model.AuthorizeUser'
      responses:
        '200':
          $ref: '#/components/responses/Auth.ResponseJson.WaitingConfirmOperation'
        '400':
          $ref: '#/components/responses/Api.ResponseJson.Error400'
        '403':
          $ref: '#/components/responses/Api.ResponseJson.Error403'
        '422':
          $ref: '#/components/responses/Api.ResponseJson.Error422'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/signin/recovery:
    post:
      summary: Auth/R2b. Метод входа пользователя, утратившего доступ к почте
      description: |-
        Метод предназначен для входа пользователя, который не может получить код с емаила.
        Вход подтверждается комбинацией «пароль/TOTP + аварийный код», письмо при этом
        не отправляется.

        ### Алгоритм входа:
        1. Пользователь указывает свой емаил или телефон в качестве логина;
        2. Пользователю предлагается ввести пароль или TOTP код (`PATCH /v1/operation/confirm`,
          `confirm_method` — `PASSWORD` либо `TOTP`);
        3. Затем предлагается ввести один из одноразовых аварийных кодов
          (`confirm_method` — `RECOVERY`);
        4. Пользователь получает доступ к своему аккаунту (`POST /v1/session`);

        Аварийный код стоит последним звеном не случайно: он гасится в момент предъявления,
        поэтому предъявить его раньше, чем комбинация принята целиком, нельзя. За один вход
        расходуется не более одного кода.

        Комбинации с кодом из письма даёт обычный `POST /v1/signin`: там аварийный код тоже
        принимается, но вместо второго фактора и без объявления заранее. Здесь же кода из письма
        в цепочке нет вовсе, поэтому у метода нет ни `429` с `Retry-After`, ни полей повторной
        отправки в ответе.

        Ответы метода одинаковы независимо от того, включена ли у аккаунта 2FA: аккаунту без неё
        операция создаётся такая же и с тем же набором полей. Подтвердить её он не сможет —
        доказательств у него нет, — но определить состояние аккаунта по ответам метода нельзя.

        ### Значения `code` в ответе `400`
        - `ValidateError/realm` / `ValidateError/user_login` — поле не указано или не проходит
          проверку схемы;
        - `LoginNotExists/user_login` — логин не зарегистрирован;

        ### Причины ответа `403`
        - метод гостевой: запрос выполнен с действующим access-токеном, то есть вызывающий уже
          авторизован и повторно авторизовываться ему нельзя;
      operationId: authorizeUserByRecovery
      tags:
        - Auth
      x-auth-scopes:
        - guests-only
      security: []
      requestBody:
        required: true
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/Auth.Request.Model.AuthorizeUser'
      responses:
        '200':
          $ref: '#/components/responses/Auth.ResponseJson.WaitingConfirmOperation'
        '400':
          $ref: '#/components/responses/Api.ResponseJson.Error400'
        '403':
          $ref: '#/components/responses/Api.ResponseJson.Error403'
        '422':
          $ref: '#/components/responses/Api.ResponseJson.Error422'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/session:
    post:
      summary: Auth/R3. Метод открытия новой сессии пользователя
      description: |-
        Метод предназначен для открытия новой сессии пользователя по подтверждённой операции,
        при этом возвращаются сгенерированные access и refresh токены для поддержания активности сессии.

        В теле запроса указывается `token` - токен операции входа (`POST /v1/signin`) или регистрации
        (`POST /v1/signup`), а именно токен последнего полученного звена цепочки подтверждений.

        При передаче заголовка `X-Use-Cookie: true` новый refreshToken вернётся в заголовке Set-Cookie
        (кука RTID), а не в теле ответа.

        ### Когда указывается `secret`
        Метод совмещает два шага: подтверждает текущее звено операции и, если звеньев не осталось,
        открывает сессию (этим он и отличается от `POST /v1/security/apply-*`, которым нужна уже
        подтверждённая операция). Отсюда правило:

        - операция подтверждена **не полностью** - `secret` обязателен: в нём передаётся код с
          емаила/телефона либо пароль/TOTP код (или аварийный код) звена второго фактора. Если после
          этого звенья ещё остаются, возвращается `200` с `WaitingConfirmOperation` следующего звена,
          иначе `201`;
        - операция подтверждена **полностью** - `secret` не указывается, подтверждать нечего. Так
          бывает, когда последнее звено пройдено через `PATCH /v1/operation/confirm` (ответ `204`),
          а также при повторе запроса после `429` или сетевого сбоя: подтверждённая операция не
          расходуется до успешного открытия сессии, поэтому вход повторяется тем же токеном
          (см. «Причины ответа `429`»). Повторный вызов по подтверждённой операции идемпотентен,
          переданный в этом случае `secret` игнорируется;

        ### Значения `code` в ответе `400`
        - `ValidateError/token` / `ValidateError/secret` — поле не проходит проверку схемы
          (для `secret` в том числе пустой строкой; само отсутствие поля схему не нарушает);
        - `ConfirmCodeIsRequired/secret` — операция подтверждена не полностью, а `secret` не передан:
          подтверждать нечем. Это не ошибка ввода, а его отсутствие — попытка не расходуется,
          требуется `secret` текущего звена; ответ дополнен объектом
          `operation_state` с актуальными счётчиками операции;
        - `ConfirmCodeIsIncorrect/secret` / `NoAttemptsToConfirmOperation/secret` — код подтверждения
          неверен либо исчерпаны попытки подтверждения; ответ дополнен объектом `operation_state`
          с актуальными счётчиками операции;
        - `OperationInvalid/token` — токен операции неизвестен, истёк или уже использован;
        - `OperationAlreadyExpired/token` — срок жизни операции истёк, её нужно создавать заново;

        Отключение 2FA после создания операции отдельным кодом не отражается: подтверждение звена
        второго фактора в этом случае отвечает обычным `ConfirmCodeIsIncorrect`. Иначе по ответу
        метода читалось бы состояние 2FA аккаунта, а он гостевой.

        ### Причины ответа `403`
        - метод гостевой: запрос выполнен с действующим access-токеном, то есть вызывающий уже
          авторизован и открывать новую сессию ему нельзя;
        - указанный токен относится к операции, которая не является регистрацией или входом
          в систему, поэтому открыть по ней сессию нельзя;
        - привязка пользователя к realm'у операции снята между её созданием и входом:
          доступ к контуру отозван, войти по этой операции нельзя;

        ### Причины ответа `429`
        - превышен лимит одновременных сессий (hard-порог): вход отклонён до тех пор, пока фоновая
          чистка не освободит место. Подтверждённая операция при этом не расходуется, поэтому
          повторить нужно вход тем же токеном (уже без `secret`) — через время из заголовка
          `Retry-After` и пока не истёк срок жизни операции;
      operationId: openUserSession
      tags:
        - Auth
      x-auth-scopes:
        - guests-only
      security: []
      parameters:
        - $ref: '#/components/parameters/Auth.Request.Header.Web.UseCookie'
      requestBody:
        required: true
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/Auth.Request.Model.LoginByToken'
      responses:
        '200':
          $ref: '#/components/responses/Auth.ResponseJson.WaitingConfirmOperation'
        '201':
          $ref: '#/components/responses/Auth.ResponseJson.SuccessAccess'
        '400':
          $ref: '#/components/responses/Auth.ResponseJson.Error400'
        '403':
          $ref: '#/components/responses/Api.ResponseJson.Error403'
        '422':
          $ref: '#/components/responses/Api.ResponseJson.Error422'
        '429':
          $ref: '#/components/responses/Api.ResponseJson.Error429'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
    patch:
      summary: Auth/R4. Метод продления текущей сессии пользователя
      description: |-
        Метод предназначен для продления текущей сессии пользователя по указанному refreshToken,
        при этом возвращаются новые сгенерированные access и refresh токены для поддержания активности сессии.
        Идентификатор сессии (sid) сохраняется — продление происходит в рамках той же сессии.

        Важно! RefreshToken одноразовый. В течение короткого grace-окна (≈60 секунд) после ротации
        повторный запрос с тем же refreshToken вернёт те же ранее выданные токены (идемпотентный
        ретрай — для устойчивости к гонкам и повторам сети между вкладками).

        Повторное использование того же refreshToken вне grace-окна трактуется как компрометация:
        текущая сессия принудительно закрывается (отзываются её refresh-линия и видимость сессии),
        остальные сессии пользователя не затрагиваются. (В будущем при наличии fingerprint устройства
        сильный сигнал кражи сможет эскалировать отзыв до всех сессий пользователя.)

        Если в заголовке запроса будет присутствовать кука под именем RTID, то в ней должен лежать
        refreshToken. Иначе refreshToken должен находиться в теле запроса.

        Если refreshToken был найден в куке RTID, то новый refreshToken вернётся в заголовке Set-Cookie.

        ### Значения `code` в ответе `400`
        - `ValidateError/refresh_token` — refresh токен не указан или не проходит проверку схемы;

        ### Причины ответа `401`
        - refresh токен неизвестен, истёк или уже был использован (в том числе когда сессия закрыта
          из-за повторного использования токена). Продлевать нечего — нужен новый вход
          (`POST /v1/signin` → `POST /v1/session`). Ответ не зависит от того, пришёл токен полем
          тела или кукой RTID, и, как все ответы `401`, кода ошибки в теле не несёт;
      operationId: continueUserSession
      tags:
        - Auth
      security: []
      parameters:
        - $ref: '#/components/parameters/Auth.Request.Cookie.Web.RefreshToken'
      requestBody:
        required: false
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/Auth.Request.Model.ContinueSession'
      responses:
        '201':
          $ref: '#/components/responses/Auth.ResponseJson.SuccessAccess'
        '400':
          $ref: '#/components/responses/Api.ResponseJson.Error400'
        '401':
          $ref: '#/components/responses/Api.ResponseJson.Error401'
        '422':
          $ref: '#/components/responses/Api.ResponseJson.Error422'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
    delete:
      summary: Auth/R5. Метод закрытия текущей сессий пользователя
      description: |-
        Метод предназначен для закрытия текущей сессии пользователя.

        Если в заголовке запроса присутствует кука RTID, refreshToken берётся из неё и тело не требуется
        (web-клиент). Иначе (мобайл/API-клиент) refreshToken должен быть передан в теле запроса.

        Закрывается только сессия самого вызывающего: refresh токен чужой сессии обрабатывается так же,
        как неизвестный, — сессия не закрывается, а ответ не раскрывает, что токен существует.

        Метод идемпотентен: повторное закрытие уже закрытой сессии, как и неизвестный или чужой
        refresh токен, молча игнорируется и также возвращает `204`.

        ### Значения `code` в ответе `400`
        - `ValidateError/refresh_token` — refresh токен не указан или не проходит проверку схемы;

        ### Причины ответа `403`
        - общие причины отказа — см. «Аутентификация и доступ» в описании API;
      operationId: closeUserSession
      tags:
        - Auth
      x-auth-scopes:
        - any-users
      parameters:
        - $ref: '#/components/parameters/Auth.Request.Cookie.Web.RefreshToken'
      requestBody:
        required: false
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/Auth.Request.Model.ContinueSession'
      responses:
        '204':
          description: Текущая сессия пользователя была закрыта
        '400':
          $ref: '#/components/responses/Api.ResponseJson.Error400'
        '401':
          $ref: '#/components/responses/Api.ResponseJson.Error401'
        '403':
          $ref: '#/components/responses/Api.ResponseJson.Error403'
        '422':
          $ref: '#/components/responses/Api.ResponseJson.Error422'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/user:
    get:
      summary: Auth/R6. Метод получения информации о пользователе
      description: |-
        Метод предназначен для получения информации из БД о текущем пользователе.

        ### Причины ответа `403`
        - общие причины отказа — см. «Аутентификация и доступ» в описании API;
      operationId: getUserInfo
      tags:
        - Auth
      x-auth-scopes:
        - any-users
      responses:
        '200':
          description: Сформирован ответ с информацией о текущем пользователе
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Auth.Response.Model.UserInfo'
        '401':
          $ref: '#/components/responses/Api.ResponseJson.Error401'
        '403':
          $ref: '#/components/responses/Api.ResponseJson.Error403'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/user/settings:
    post:
      summary: Auth/R7. Метод изменения языка и часового пояса пользователя
      description: |-
        Метод предназначен для изменения языка (локали) и часового пояса текущего пользователя.
        Сохраняются всегда обе настройки, но оба поля тела необязательны, и отсутствующее поле
        означает **режим «авто»**: настройка определяется по самому запросу — так же, как при
        регистрации (`POST /v1/signup`). Поэтому присылать нужно только те настройки,
        которые пользователь задал явно; пустая строка является невалидным значением.
        Приоритет источников в режиме «авто»: query-параметр (`lang`/`tz`), затем заголовок клиента
        (`Accept-Language`/`X-Accept-Time-Zone`), затем значение приложения по умолчанию.
        Уже сохранённые настройки пользователя в подборе **не участвуют**: в режиме «авто» клиент
        просит определить настройку по своему текущему окружению, а не вернуть ту, что уже задана.
        В ответе возвращаются оба сохранённых значения, в том числе подобранные в режиме «авто».
        Указанные явно значения проверяются строго: принимаются только язык и часовой пояс,
        поддерживаемые приложением; подбор ближайшего здесь не выполняется.
        Сохранённые язык и часовой пояс фиксируются в токене на момент его выпуска, поэтому
        применяются к ответам только после ближайшего продления сессии (`PATCH /v1/session`),
        которое клиент выполняет штатно, — повторный вход не требуется. Окно ограничено
        остатком времени жизни текущего access-токена (`expires_in`); применить новые значения
        к конкретному ответу раньше можно параметрами `lang`/`tz`.

        ### Значения `code` в ответе `400`
        - `ValidateError/lang` / `ValidateError/tz` — одноимённое **поле тела** указано явно, но не проходит
          проверку схемы либо не входит в список поддерживаемых приложением; одноимённые query-параметры
          к отказу не приводят — см. «Общие параметры запросов» в описании API;

        ### Причины ответа `403`
        - общие причины отказа — см. «Аутентификация и доступ» в описании API;
      operationId: changeUserSettings
      tags:
        - Auth
      x-auth-scopes:
        - any-users
      parameters:
        - $ref: '#/components/parameters/Api.Request.Header.AcceptLanguage'
        - $ref: '#/components/parameters/Api.Request.Header.AcceptTimeZone'
        - $ref: '#/components/parameters/Api.Request.Query.Language'
        - $ref: '#/components/parameters/Api.Request.Query.TimeZone'
      requestBody:
        required: true
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/Auth.Request.Model.ChangeUserSettings'
      responses:
        '200':
          description: Язык и часовой пояс пользователя обновлены
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Auth.Response.Model.UserSettings'
        '400':
          $ref: '#/components/responses/Api.ResponseJson.Error400'
        '401':
          $ref: '#/components/responses/Api.ResponseJson.Error401'
        '403':
          $ref: '#/components/responses/Api.ResponseJson.Error403'
        '422':
          $ref: '#/components/responses/Api.ResponseJson.Error422'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/check/check-login:
    post:
      summary: Auth/CK/R1. Метод проверяет свободен ли указанный емаил/телефон
      description: |-
        Метод предназначен для проверки, свободен ли указанный емаил/телефон: емаил — для регистрации
        (`POST /v1/signup`) или смены адреса (`POST /v1/security/email`), телефон — для его установки
        (`POST /v1/security/phone`).

        ### Значения `code` в ответе `400`
        - `ValidateError/realm` / `ValidateError/user_login` — поле не указано или не проходит
          проверку схемы (в т.ч. когда логин не является емаилом/телефоном);
        - `EmailAlreadyExists/user_login` / `PhoneAlreadyExists/user_login` — логин уже занят
          другим пользователем;
      operationId: checkLogin
      tags:
        - Auth.Check
      security: []
      requestBody:
        required: true
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/Auth.Check.Request.Model.CheckLogin'
      responses:
        '204':
          description: Указанный емаил/телефон свободен для регистрации пользователя
        '400':
          $ref: '#/components/responses/Api.ResponseJson.Error400'
        '422':
          $ref: '#/components/responses/Api.ResponseJson.Error422'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/check/calc-password-strength:
    post:
      summary: Auth/CK/R2. Метод рассчитывает надёжность указанного пароля
      description: |-
        Метод предназначен для расчёта надёжности указанного пароля.

        Поле `acceptable` сообщает, проходит ли пароль порог надёжности, который применяет
        `POST /v1/security/password`.

        ### Значения `code` в ответе `400`
        - `ValidateError/password` — пароль не указан или не проходит проверку схемы;
      operationId: calcPasswordStrength
      tags:
        - Auth.Check
      security: []
      requestBody:
        required: true
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/Auth.Check.Request.Model.CalcPasswordStrength'
      responses:
        '200':
          description: Сформирован ответ с информацией о надёжности пароля
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Auth.Check.Response.Model.CalcPasswordStrength'
        '400':
          $ref: '#/components/responses/Api.ResponseJson.Error400'
        '422':
          $ref: '#/components/responses/Api.ResponseJson.Error422'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/check/generate-password:
    post:
      summary: Auth/CK/R3. Метод генерации пароля
      description: |-
        Метод предназначен для помощи пользователю при установке нового пароля.

        Сгенерированный пароль гарантированно имеет надёжность `THE_BEST` по оценке метода
        `POST /v1/check/calc-password-strength`, поэтому запрашивать её для него не требуется.
      operationId: generatePassword
      tags:
        - Auth.Check
      security: []
      responses:
        '200':
          description: Сгенерирован новый пароль
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Auth.Check.Response.GeneratedPassword'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /.well-known/jwks.json:
    get:
      summary: Auth/CK/R4. Метод отдаёт публичные JWT-ключи (JWKS, RFC 7517)
      description: |
        Метод предназначен для публикации набора публичных ключей (JWKS, RFC 7517),
        которыми внешние сервисы могут самостоятельно проверять подпись выданных
        этим сервисом access-токенов. Симметричные (HMAC) ключи не публикуются.
      operationId: getJwks
      tags:
        - Auth.Check
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Auth.Check.ResponseJson.Jwks'
        '404':
          $ref: '#/components/responses/Api.ResponseJson.Error404'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/operation/confirm:
    patch:
      summary: Auth/OP/R1. Метод подтверждения операции
      description: |-
        Метод предназначен для подтверждения указанной операции инициированной пользователем.

        Операция может требовать нескольких последовательных подтверждений (звеньев цепочки):
        обычно сначала код с емаила/телефона, затем — если у пользователя включена 2FA — пароль или
        TOTP код. У операций, созданных методами `.../recovery`, цепочка другая: второй фактор,
        затем аварийный код (см. «Аварийные коды»). Какое звено подтверждается сейчас, указано
        в `confirm_method`. Отсюда два кода успешного ответа:

        - `204` — операция подтверждена **полностью**, звеньев не осталось; можно вызывать
          завершающий метод операции (`POST /v1/security/apply-*`, а для операций входа и
          регистрации — `POST /v1/session`, уже без `secret`);
        - `200` — подтверждено **текущее** звено, но требуется ещё одно; в теле —
          `WaitingConfirmOperation` следующего звена, где `confirm_method` — метод следующей
          проверки, а `remaining_attempts`/`expires_in` относятся уже к нему;

        Повторный вызов по уже подтверждённой операции идемпотентен: подтверждать нечего, поэтому
        снова возвращается `204`, а переданный `secret` игнорируется. Подтверждённая операция не
        расходуется до вызова завершающего метода, поэтому шаг можно безопасно повторить тем же
        токеном после сетевого сбоя или отказа завершающего метода (см. `POST /v1/session`).

        Особенности звеньев, к которым код не высылается
        (`confirm_method`: `PASSWORD`, `TOTP` или `RECOVERY`):

        - поля `remaining_resends` и `resends_in` **не возвращаются** — повторная отправка к
          такому звену неприменима (код никуда не отправляется, см. описание этих полей);
        - `token` следующего звена **всегда новый**: при переходе к нему выдаётся новый токен
          операции, а предыдущий сразу перестаёт действовать. Все последующие вызовы
          (`PATCH /v1/operation/confirm`, `POST /v1/security/apply-*`) выполняются с токеном
          **последнего полученного** звена;
        - звено второго фактора завершающее — за ним следует `204`, а не очередной `200`.
          Исключение единственное: в цепочке метода `.../recovery` за ним идёт звено `RECOVERY`,
          которое завершающее всегда;

        ### Аварийные коды
        Аварийный код принимается **только последним звеном** цепочки — двумя способами:

        - **вместо** основного доказательства последнего звена, в том же поле `secret`. Так работают
          вход и отключение 2FA: на звене второго фактора можно ввести пароль/TOTP код либо аварийный
          код, заранее объявлять выбор не нужно, и в ответе метода это никак не отражается;
        - **отдельным звеном** `confirm_method: RECOVERY`, которое идёт за звеном второго фактора.
          Такая цепочка создаётся отдельными методами — `POST /v1/signin/recovery` и
          `POST /v1/security/email/recovery` — и предназначена тем, кто утратил доступ к почте:
          кода из письма в ней нет вовсе.

        Где какой способ доступен:

        | Операция                                               | Вместо второго фактора | Отдельным звеном                        |
        |--------------------------------------------------------|------------------------|-----------------------------------------|
        | вход                                                   | да                     | да (`POST /v1/signin/recovery`)         |
        | отключение 2FA                                         | да                     | нет                                     |
        | смена емаила                                           | нет                    | да (`POST /v1/security/email/recovery`) |
        | перевыпуск аварийных кодов                             | нет                    | нет                                     |
        | регистрация, смена телефона, установка пароля или TOTP | нет                    | нет                                     |

        Отсюда следствие: за одну операцию расходуется не более одного аварийного кода, и гасится он
        ровно в тот момент, когда комбинация доказательств принята целиком, — предъявить его раньше
        последнего звена попросту негде. Аварийный код, предъявленный там, где он недопустим,
        отклоняется как неверный и при этом не расходуется.

        Метод гостевой: правом на подтверждение служит владение самим токеном операции, а не
        access-токен, — иначе завершить вход или регистрацию было бы невозможно. Поэтому
        принадлежность операции вызывающему **не проверяется** и ответа `403` у метода нет;
        отозвать операцию (`PATCH /v1/operation/revoke`) и завершить её
        (`POST /v1/security/apply-*`), напротив, может только её владелец.

        ### Значения `code` в ответе `400`
        - `ValidateError/token` / `ValidateError/secret` — поле не указано или не проходит проверку схемы;
        - `ConfirmCodeIsIncorrect/secret` / `NoAttemptsToConfirmOperation/secret` — код подтверждения
          неверен либо исчерпаны попытки подтверждения; ответ дополнен объектом `operation_state`
          с актуальными счётчиками операции;
        - `OperationInvalid/token` — токен операции неизвестен, истёк или уже использован;
        - `OperationAlreadyExpired/token` — срок жизни операции истёк, её нужно создавать заново;

        Отключение 2FA после создания операции отдельным кодом не отражается: подтверждение звена
        второго фактора в этом случае отвечает обычным `ConfirmCodeIsIncorrect`. Иначе по ответу
        метода читалось бы состояние 2FA аккаунта, а он гостевой.
      operationId: confirmUserOperation
      tags:
        - Auth.Operation
      security: []
      requestBody:
        required: true
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/Auth.Operation.Request.Model.ConfirmOperation'
      responses:
        '200':
          $ref: '#/components/responses/Auth.ResponseJson.WaitingConfirmOperation'
        '204':
          description: |-
            Указанная операция подтверждена полностью, звеньев подтверждения не осталось -
            можно вызывать завершающий метод операции (`POST /v1/security/apply-*`, а для
            операций входа и регистрации - `POST /v1/session`, уже без `secret`)
        '400':
          $ref: '#/components/responses/Auth.ResponseJson.Error400'
        '422':
          $ref: '#/components/responses/Api.ResponseJson.Error422'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/operation/resend:
    patch:
      summary: Auth/OP/R2. Метод повторной отправки кода подтверждения
      description: |-
        Метод предназначен для повторной отправки кода подтверждения указанной операции
        инициированной пользователем на емаил/телефон

        Метод гостевой: правом на повторную отправку служит владение самим токеном операции, а не
        access-токен, поэтому принадлежность операции вызывающему **не проверяется** и ответа `403`
        у метода нет (в отличие от `PATCH /v1/operation/revoke`).

        ### Значения `code` в ответе `400`
        - `ValidateError/token` — токен операции не указан или не проходит проверку схемы;
        - `SendingNewMessagesIsTemporarilyRestricted/token` — повторная отправка временно ограничена
          (слишком часто); ответ дополнен объектом `operation_state` с актуальными счётчиками операции.
          Отказ временный, но отдаётся кодом `400`, а не `429`: срок повтора передаётся в
          `operation_state.resends_in`, а тело `429` (problem+json) ни `code`, ни счётчиков не вмещает;
        - `OperationInvalid/token` — токен операции неизвестен, истёк или уже использован;
        - `OperationAlreadyExpired/token` — срок жизни операции истёк, её нужно создавать заново;
        - `OperationAlreadyConfirmed/token` — операция уже подтверждена, отправлять код повторно незачем;
        - `NoAttemptsToResendCode/token` — повторные отправки израсходованы окончательно: ждать
          бессмысленно, операцию нужно создавать заново; ответ дополнен объектом `operation_state`;
        - `ResendCodeIsNotSupported/token` — текущее звено операции подтверждается доказательством,
          которое никуда не высылается: вторым фактором (`PASSWORD`/`TOTP`) либо аварийным кодом
          (`RECOVERY`), — поэтому отправлять по нему нечего: код повторно не высылается. У цепочек,
          созданных методами `.../recovery`, это верно с самого первого звена;
      operationId: resendUserOperationConfirmCode
      tags:
        - Auth.Operation
      security: []
      requestBody:
        required: true
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/Auth.Operation.Request.Model.OperationToken'
      responses:
        '200':
          $ref: '#/components/responses/Auth.ResponseJson.WaitingConfirmOperation'
        '400':
          $ref: '#/components/responses/Auth.ResponseJson.Error400'
        '422':
          $ref: '#/components/responses/Api.ResponseJson.Error422'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/operation/revoke:
    patch:
      summary: Auth/OP/R3. Метод отзыва/отмены операции
      description: |-
        Метод предназначен для отзыва/отмены пользователем указанной операции, если это возможно

        ### Значения `code` в ответе `400`
        - `ValidateError/token` — токен операции не указан или не проходит проверку схемы;
        - `OperationInvalid/token` — токен операции неизвестен, истёк или уже использован
          (в том числе когда её отозвал конкурентный запрос между чтением и удалением);
        - `OperationAlreadyExpired/token` — срок жизни операции истёк, отзывать уже нечего;

        ### Причины ответа `403`
        - указанная операция принадлежит другому пользователю;
        - общие причины отказа — см. «Аутентификация и доступ» в описании API;
      operationId: revokeUserOperation
      tags:
        - Auth.Operation
      x-auth-scopes:
        - any-users
      requestBody:
        required: true
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/Auth.Operation.Request.Model.OperationToken'
      responses:
        '204':
          description: Указанная операция была отозвана
        '400':
          $ref: '#/components/responses/Api.ResponseJson.Error400'
        '401':
          $ref: '#/components/responses/Api.ResponseJson.Error401'
        '403':
          $ref: '#/components/responses/Api.ResponseJson.Error403'
        '422':
          $ref: '#/components/responses/Api.ResponseJson.Error422'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/security/email:
    post:
      summary: Auth/SC/R1a. Метод создания операции на изменение емаила пользователя
      description: |-
        Метод предназначен для создания операции изменения емаила текущего пользователя.

        ### Алгоритм изменения емаила пользователя:
        1. `POST /v1/security/email` (новый емаил) — отправляется код подтверждения на **текущий**
          емаил: операция собирает доказательства владения аккаунтом, а не новым адресом;
        2. Пользователь указывает полученный код и подтверждает операцию (`PATCH /v1/operation/confirm`);
        3. Если 2FA включена — пользователю предлагается ввести пароль или TOTP код;
        4. Пользователь применяет подтверждённую операцию методом `POST /v1/security/apply-email` —
          емаил **пока не меняется**: создаётся операция подтверждения владения новым адресом,
          код уходит на **новый** емаил, а на прежний — уведомление о запросе смены;
        5. Пользователь указывает код с нового адреса (`PATCH /v1/operation/confirm`, единственное
          звено `EMAIL`; повторный step-up не требуется — он оплачен на шаге 1);
        6. Пользователь применяет подтверждённую операцию методом `POST /v1/security/apply-operation` —
          емаил изменяется на новый, на прежний емаил отправляется уведомление;

        Пока созданная на шаге 4 операция не применена, адрес аккаунта остаётся прежним, а саму
        операцию видно в `GET /v1/user` (`pending_operations`) вместе со сроком истечения; отозвать
        её можно методом `PATCH /v1/operation/revoke`, по истечении срока она закрывается сама.
        Включение или отключение 2FA отзывает начатую смену вместе с остальными незавершёнными
        операциями пользователя (см. описание API). Знание одного лишь кода с нового адреса смену
        не завершает — оба завершающих метода требуют сессии.

        Если 2FA включена, смена адреса требует пароль или TOTP код: после неё аккаунт продолжает
        зависеть от второго фактора, но уже не от прежнего емаила. Поэтому этим методом аварийный код
        не принимается ни на одном шаге — комбинация «код с емаила + аварийный код» отклоняется.
        У аккаунта с выключенной 2FA второго фактора нет вовсе, и цепочка ограничивается кодом
        с текущего емаила.
        Комбинация «пароль/TOTP + аварийный код» — это выход из сценария утраченного доступа
        к почте, и создаётся она отдельным методом `POST /v1/security/email/recovery`.

        ### Влияние на сессии
        Сессии и токены не затрагиваются — см. описание API.

        ### Значения `code` в ответе `400`
        - `ValidateError/new_email` — новый емаил не указан или не проходит проверку схемы (в т.ч.
          когда значение не является емаил адресом);
        - `EmailAlreadyExists/new_email` — новый емаил уже используется другим пользователем;

        ### Причины ответа `403`
        - общие причины отказа — см. «Аутентификация и доступ» в описании API;
      operationId: changeUserEmail
      tags:
        - Auth.Security
      x-auth-scopes:
        - any-users
      requestBody:
        required: true
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/Auth.Security.Request.Model.ChangeEmail'
      responses:
        '200':
          $ref: '#/components/responses/Auth.ResponseJson.WaitingConfirmOperation'
        '400':
          $ref: '#/components/responses/Api.ResponseJson.Error400'
        '401':
          $ref: '#/components/responses/Api.ResponseJson.Error401'
        '403':
          $ref: '#/components/responses/Api.ResponseJson.Error403'
        '422':
          $ref: '#/components/responses/Api.ResponseJson.Error422'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/security/email/recovery:
    post:
      summary: Auth/SC/R1b. Метод создания операции изменения емаила при утрате доступа к нему
      description: |-
        Метод предназначен для смены емаила пользователем, который не может получить код
        с текущего адреса. Операция подтверждается комбинацией «пароль/TOTP + аварийный код»,
        письмо при этом не отправляется. Это выход из сценария утраченного доступа к почте:
        обычный `POST /v1/security/email` требует кода с текущего адреса.

        ### Алгоритм изменения емаила пользователя:
        1. `POST /v1/security/email/recovery` (новый емаил) — создаётся операция, письмо
          не отправляется;
        2. Пользователю предлагается ввести пароль или TOTP код (`PATCH /v1/operation/confirm`,
          `confirm_method` — `PASSWORD` либо `TOTP`);
        3. Затем предлагается ввести один из одноразовых аварийных кодов
          (`confirm_method` — `RECOVERY`);
        4. Дальше — как у `POST /v1/security/email`: пользователь применяет подтверждённую операцию
          методом `POST /v1/security/apply-email` (создаётся операция подтверждения владения новым
          адресом, код уходит на новый емаил, уведомление о запросе смены — на прежний), подтверждает
          её кодом с нового адреса (`PATCH /v1/operation/confirm`) и применяет
          методом `POST /v1/security/apply-operation` — только тогда емаил изменяется на новый;

        Смена адреса этим методом требует пароль или TOTP код: после неё аккаунт продолжает зависеть
        от второго фактора, но уже не от прежнего емаила. Поэтому здесь аварийный код принимается
        в дополнение ко второму фактору, а не вместо него, и комбинация «код с емаила + аварийный
        код» недопустима ни этим методом, ни обычным.

        После смены адреса имеет смысл перевыпустить аварийные коды
        (`POST /v1/security/recovery-codes`) — уже новой парой «код с емаила + пароль/TOTP».

        ### Влияние на сессии
        Сессии и токены не затрагиваются — см. описание API.

        ### Значения `code` в ответе `400`
        - `ValidateError/new_email` — новый емаил не указан или не проходит проверку схемы (в т.ч.
          когда значение не является емаил адресом);
        - `EmailAlreadyExists/new_email` — новый емаил уже используется другим пользователем;

        ### Причины ответа `403`
        - общие причины отказа — см. «Аутентификация и доступ» в описании API;

        ### Причины ответа `409`
        - 2FA аутентификация выключена: доказательство у такого аккаунта единственное — код
          на текущий адрес, поэтому смена адреса проводится обычным `POST /v1/security/email`.
          Состояние 2FA здесь не скрывается: метод авторизованный, вызывающий и есть владелец;
      operationId: changeUserEmailByRecovery
      tags:
        - Auth.Security
      x-auth-scopes:
        - any-users
      requestBody:
        required: true
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/Auth.Security.Request.Model.ChangeEmail'
      responses:
        '200':
          $ref: '#/components/responses/Auth.ResponseJson.WaitingConfirmOperation'
        '400':
          $ref: '#/components/responses/Api.ResponseJson.Error400'
        '401':
          $ref: '#/components/responses/Api.ResponseJson.Error401'
        '403':
          $ref: '#/components/responses/Api.ResponseJson.Error403'
        '409':
          $ref: '#/components/responses/Api.ResponseJson.Error409'
        '422':
          $ref: '#/components/responses/Api.ResponseJson.Error422'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/security/apply-email:
    post:
      summary: Auth/SC/R1c. Метод применяет подтверждённую операцию смены емаила
      description: |-
        Метод завершает первый шаг смены адреса — тот, на котором пользователь доказал владение
        аккаунтом (`POST /v1/security/email` либо `POST /v1/security/email/recovery`), — и начинает
        второй: создаёт **операцию подтверждения владения новым адресом** и возвращает её.
        Емаил аккаунта при этом **не меняется**.

        На новый адрес уходит код подтверждения, на прежний — уведомление о запросе смены
        (дата и время, новый адрес, срок действия операции). Ссылок, выполняющих действие,
        в письмах нет.

        ### Созданная операция
        - живёт долго (порядка 72 часов) и всё это время ждёт пользователя; срок отдаётся
          в `expires_in`, а сама операция видна в `GET /v1/user` (`pending_operations`) вместе
          с новым адресом и сроком истечения;
        - подтверждается кодом с нового адреса — `PATCH /v1/operation/confirm` (единственное
          звено, `confirm_method`: `EMAIL`); второй фактор повторно не спрашивается, он предъявлен
          на первом шаге;
        - применяется методом `POST /v1/security/apply-operation` — только тогда емаил меняется
          на новый, а на прежний адрес уходит уведомление о состоявшейся смене;
        - отзывается методом `PATCH /v1/operation/revoke` в любой момент до применения;
        - повторная отправка кода (`PATCH /v1/operation/resend`) выдаёт новый код, но срок жизни
          операции **не продлевает**: он отсчитывается от её создания;
        - одновременно у аккаунта существует не более одной такой операции: создание новой
          закрывает предыдущую;

        ### Влияние на сессии
        Сессии и токены не затрагиваются — см. описание API.

        ### Значения `code` в ответе `400`
        - `ValidateError/token` — токен операции не указан или не проходит проверку схемы;
        - `OperationInvalid/token` — токен операции неизвестен, истёк или уже использован;
        - `OperationIsNotConfirmed/token` — операция ещё не подтверждена: сначала нужно пройти
          подтверждение через `PATCH /v1/operation/confirm`;
        - `OperationAlreadyExpired/token` — срок жизни операции истёк, её нужно создавать заново;
        - `EmailAlreadyExists` — новый емаил заняли, пока шло подтверждение первого шага;
          смену нужно начинать заново с другим адресом. Ошибка не привязана к полю: в запросе
          передаётся только токен;

        ### Причины ответа `403`
        - указанная операция принадлежит другому пользователю;
        - токен указывает на операцию другого типа, а не на смену емаила
          (`POST /v1/security/email`, `POST /v1/security/email/recovery`);
        - общие причины отказа — см. «Аутентификация и доступ» в описании API;
      operationId: applyUserEmail
      tags:
        - Auth.Security
      x-auth-scopes:
        - any-users
      requestBody:
        required: true
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/Auth.Security.Request.Model.ApplyByToken'
      responses:
        '200':
          $ref: '#/components/responses/Auth.ResponseJson.WaitingConfirmOperation'
        '400':
          $ref: '#/components/responses/Api.ResponseJson.Error400'
        '401':
          $ref: '#/components/responses/Api.ResponseJson.Error401'
        '403':
          $ref: '#/components/responses/Api.ResponseJson.Error403'
        '422':
          $ref: '#/components/responses/Api.ResponseJson.Error422'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/security/phone:
    post:
      summary: Auth/SC/R2. Метод создания операции на установку/изменение телефона пользователя
      description: |-
        Метод предназначен для создания операции установки/изменения телефона текущего пользователя.

        ### Алгоритм установки/изменения телефона пользователя:
        1. `POST /v1/security/phone` (новый телефон) — отправляется код подтверждения на текущий емаил;
        2. Пользователь указывает полученный код и подтверждает операцию (`PATCH /v1/operation/confirm`);
        3. Если 2FA включена — пользователю предлагается ввести пароль или TOTP код
          для подтверждения операции;
        4. Пользователь применяет подтверждённую операцию методом `POST /v1/security/apply-operation` —
          телефон устанавливается/изменяется на новый;
        5. На текущий емаил отправляется уведомление, что телефон был установлен/изменён;

        Код подтверждения уходит на текущий емаил — операция доказывает владение аккаунтом. Сам новый
        номер кодом не проверяется: отправка кодов на телефон не поддерживается.

        ### Влияние на сессии
        Сессии и токены не затрагиваются — см. описание API.

        ### Значения `code` в ответе `400`
        - `ValidateError/new_phone` — новый телефон не указан или не проходит проверку схемы (в т.ч.
          когда значение не является номером: неверное число цифр или недопустимый код);
        - `PhoneAlreadyExists/new_phone` — новый телефон уже используется другим пользователем;

        ### Причины ответа `403`
        - общие причины отказа — см. «Аутентификация и доступ» в описании API;
      operationId: changeUserPhone
      tags:
        - Auth.Security
      x-auth-scopes:
        - any-users
      requestBody:
        required: true
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/Auth.Security.Request.Model.ChangePhone'
      responses:
        '200':
          $ref: '#/components/responses/Auth.ResponseJson.WaitingConfirmOperation'
        '400':
          $ref: '#/components/responses/Api.ResponseJson.Error400'
        '401':
          $ref: '#/components/responses/Api.ResponseJson.Error401'
        '403':
          $ref: '#/components/responses/Api.ResponseJson.Error403'
        '422':
          $ref: '#/components/responses/Api.ResponseJson.Error422'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/security/password:
    post:
      summary: Auth/SC/R3a. Метод создания операции на установку пароля пользователя (2FA)
      description: |-
        Метод предназначен для создания операции установки пароля текущего пользователя в качестве
        второго фактора (2FA по паролю).

        **Важно:** установить пароль как 2FA можно только когда 2FA **выключена**. Если уже включён
        любой второй фактор (пароль или TOTP), метод возвращает ошибку — сначала нужно отключить 2FA
        через `POST /v1/security/disable2fa`, и только затем установить новый пароль.

        ### Алгоритм установки пароля как 2FA (2FA выключена):
        1. `POST /v1/security/password` (новый пароль) — отправляется код подтверждения на текущий емаил;
        2. Пользователь указывает полученный код и подтверждает операцию (`PATCH /v1/operation/confirm`);
        3. Пользователь применяет операцию методом `POST /v1/security/apply-password` — включается 2FA
          по паролю и единоразово возвращается набор одноразовых аварийных кодов (их нужно сохранить —
          повторно они не показываются);
        4. На текущий емаил отправляется уведомление, что включена 2FA по паролю;

        ### Значения `code` в ответе `400`
        - `ValidateError/new_password` — новый пароль не указан или не проходит проверку схемы
          (длина, допустимые символы);
        - `PasswordIsTooWeak/new_password` — надёжность пароля ниже порога, заданного приложением,
          по той же оценке, что даёт `POST /v1/check/calc-password-strength` (там такой пароль
          получает `acceptable = false`);
          сгенерированный `POST /v1/check/generate-password` пароль порог проходит всегда;

        ### Причины ответа `403`
        - общие причины отказа — см. «Аутентификация и доступ» в описании API;

        ### Причины ответа `409`
        - 2FA уже включена: установить новый второй фактор можно только после её отключения
          через `POST /v1/security/disable2fa`;
      operationId: changeUser2faPassword
      tags:
        - Auth.Security
      x-auth-scopes:
        - any-users
      requestBody:
        required: true
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/Auth.Security.Request.Model.ChangePassword'
      responses:
        '200':
          $ref: '#/components/responses/Auth.ResponseJson.WaitingConfirmOperation'
        '400':
          $ref: '#/components/responses/Api.ResponseJson.Error400'
        '401':
          $ref: '#/components/responses/Api.ResponseJson.Error401'
        '403':
          $ref: '#/components/responses/Api.ResponseJson.Error403'
        '409':
          $ref: '#/components/responses/Api.ResponseJson.Error409'
        '422':
          $ref: '#/components/responses/Api.ResponseJson.Error422'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/security/apply-password:
    post:
      summary: Auth/SC/R3b. Метод применяет подтверждённую операцию установки пароля и выдаёт аварийные коды
      description: |-
        Метод завершает установку пароля как 2FA после подтверждения операции, созданной
        методом `POST /v1/security/password`. При успехе 2FA по паролю включается и единоразово
        возвращается набор одноразовых аварийных кодов (их нужно сохранить — повторно они
        не показываются). Активный второй фактор метод не заменяет: чтобы задать новый пароль,
        текущий 2FA нужно сначала отключить через `POST /v1/security/disable2fa`.

        Включение 2FA отзывает все незавершённые операции пользователя — см. описание API.

        ### Влияние на сессии
        Сессии и токены не затрагиваются — см. описание API.

        ### Значения `code` в ответе `400`
        - `ValidateError/token` — токен операции не указан или не проходит проверку схемы;
        - `OperationInvalid/token` — токен операции неизвестен, истёк или уже использован;
        - `OperationIsNotConfirmed/token` — операция ещё не подтверждена: сначала нужно пройти
          подтверждение через `PATCH /v1/operation/confirm`;
        - `OperationAlreadyExpired/token` — срок жизни операции истёк, её нужно создавать заново;

        ### Причины ответа `403`
        - указанная операция принадлежит другому пользователю;
        - токен указывает на операцию другого типа, а не на установку пароля
          (`POST /v1/security/password`);
        - общие причины отказа — см. «Аутентификация и доступ» в описании API;

        ### Причины ответа `409`
        - 2FA была включена после создания операции (например, привязан TOTP-генератор):
          активный второй фактор не перезаписывается, его нужно сначала отключить
          через `POST /v1/security/disable2fa`;
      operationId: applyUser2faPassword
      tags:
        - Auth.Security
      x-auth-scopes:
        - any-users
      requestBody:
        required: true
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/Auth.Security.Request.Model.ApplyByToken'
      responses:
        '200':
          description: Пароль установлен как 2FA, возвращены аварийные коды
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Auth.Security.Response.RecoveryCodes'
        '400':
          $ref: '#/components/responses/Api.ResponseJson.Error400'
        '401':
          $ref: '#/components/responses/Api.ResponseJson.Error401'
        '403':
          $ref: '#/components/responses/Api.ResponseJson.Error403'
        '409':
          $ref: '#/components/responses/Api.ResponseJson.Error409'
        '422':
          $ref: '#/components/responses/Api.ResponseJson.Error422'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/security/totp:
    post:
      summary: Auth/SC/R4a. Метод создания операции на установку TOTP генератора для 2FA аутентификации пользователя
      description: |-
        Метод предназначен для создания операции установки TOTP генератора в качестве второго фактора
        (2FA по TOTP) для текущего пользователя.

        **Важно:** установить TOTP как 2FA можно только когда 2FA **выключена**. Если уже включён любой
        второй фактор (пароль или TOTP), метод возвращает ошибку — сначала нужно отключить 2FA через
        `POST /v1/security/disable2fa`, и только затем привязать новый TOTP генератор.

        ### Алгоритм установки TOTP как 2FA (2FA выключена):
        1. `POST /v1/security/totp` — создаётся операция (в ней генерируется TOTP-секрет) и отправляется
          код подтверждения на текущий емаил;
        2. Пользователь указывает полученный код и подтверждает операцию (`PATCH /v1/operation/confirm`);
        3. Пользователь добавляет генератор в TOTP-приложение (сам генератор пока не активирован):
          `GET /v1/security/totp/{token}` — секрет строкой и ссылкой `otpauth://` для ручного ввода,
          `GET /v1/security/totp/{token}/qrcode` — тот же секрет QR-кодом для сканирования;
        4. `POST /v1/security/apply-totp` (код из приложения) — генератор активируется, включается 2FA
          по TOTP и единоразово возвращается набор одноразовых аварийных кодов (их нужно сохранить);
        5. На текущий емаил отправляется уведомление, что включена 2FA по TOTP;

        ### Причины ответа `403`
        - общие причины отказа — см. «Аутентификация и доступ» в описании API;

        ### Причины ответа `409`
        - 2FA уже включена: установить новый второй фактор можно только после её отключения
          через `POST /v1/security/disable2fa`;
      operationId: changeUser2faTotpGenerator
      tags:
        - Auth.Security
      x-auth-scopes:
        - any-users
      responses:
        '200':
          $ref: '#/components/responses/Auth.ResponseJson.WaitingConfirmOperation'
        '401':
          $ref: '#/components/responses/Api.ResponseJson.Error401'
        '403':
          $ref: '#/components/responses/Api.ResponseJson.Error403'
        '409':
          $ref: '#/components/responses/Api.ResponseJson.Error409'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/security/totp/{token}:
    get:
      summary: Auth/SC/R4b. Метод возвращает секрет TOTP генератора для 2FA аутентификации пользователя
      description: |-
        Метод возвращает секрет TOTP генератора, который уже сохранён в операции: строкой в Base32
        для ручного ввода в приложение и ссылкой `otpauth://` с теми же параметрами. По ссылке
        приложение 2FA аутентификации добавляет генератор без ручного ввода — в том числе если
        открыть её на мобильном устройстве.

        При этом сам TOTP генератор пока не активируется и 2FA не включается: для этого пользователь
        должен подтвердить владение генератором, отправив код из приложения через
        `POST /v1/security/apply-totp`, который и активирует генератор, включит 2FA и единоразово
        выдаст набор одноразовых аварийных кодов.

        Тот же секрет в виде QR-кода для сканирования отдаёт `GET /v1/security/totp/{token}/qrcode`.

        ### Параметры генератора
        Применяются значения по умолчанию для `otpauth`, они же используются при проверке кода:
        период **30 секунд**, **6** цифр (совпадает с `totp_code` в `POST /v1/security/apply-totp`),
        алгоритм **SHA-1**. При проверке допускается отклонение в **±1 шаг** (±30 секунд), поэтому
        код, введённый на границе периода, принимается. Явно в `otpauth_uri` эти параметры
        не пишутся: они совпадают с дефолтными, а лишние параметры часть приложений разбирает хуже.

        ### Значения `code` в ответе `400`
        Токен операции передаётся path-параметром, а не полем тела, поэтому имя поля к кодам
        не добавляется. Токен неверной длины отдельно не проверяется и отклоняется так же, как неизвестный, — `OperationInvalid`.
        - `OperationInvalid` — токен операции неизвестен, истёк или уже использован;
        - `OperationIsNotConfirmed` — операция ещё не подтверждена: сначала нужно пройти
          подтверждение через `PATCH /v1/operation/confirm`;
        - `OperationAlreadyExpired` — срок жизни операции истёк, её нужно создавать заново;

        ### Причины ответа `403`
        - указанная операция принадлежит другому пользователю;
        - токен указывает на операцию другого типа, а не на установку TOTP генератора
          (`POST /v1/security/totp`);
        - общие причины отказа — см. «Аутентификация и доступ» в описании API;
      operationId: getTotpGeneratorSecret
      tags:
        - Auth.Security
      x-auth-scopes:
        - any-users
      parameters:
        - $ref: '#/components/parameters/Auth.Security.Request.Path.Token'
      responses:
        '200':
          description: Секрет TOTP генератора для добавления в приложение 2FA аутентификации
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Auth.Security.Response.TotpSecret'
        '400':
          $ref: '#/components/responses/Api.ResponseJson.Error400'
        '401':
          $ref: '#/components/responses/Api.ResponseJson.Error401'
        '403':
          $ref: '#/components/responses/Api.ResponseJson.Error403'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/security/totp/{token}/qrcode:
    get:
      summary: Auth/SC/R4c. Метод возвращает QR-код TOTP генератора для 2FA аутентификации пользователя
      description: |-
        Метод возвращает QR-код (изображение) для добавления генератора в приложение 2FA
        аутентификации, построенный на основе секрета, который уже сохранён в операции.
        При этом сам TOTP генератор пока не активируется и 2FA не включается: для этого пользователь
        должен подтвердить владение генератором, отправив код из приложения через
        `POST /v1/security/apply-totp`, который и активирует генератор, включит 2FA и единоразово
        выдаст набор одноразовых аварийных кодов.

        Это второе представление той же заготовки генератора: тот же секрет строкой (и ссылкой
        `otpauth://`) отдаёт `GET /v1/security/totp/{token}`.

        Параметры генератора (период, число цифр, алгоритм, допуск при проверке) — те же, что
        описаны в `GET /v1/security/totp/{token}`.

        ### Значения `code` в ответе `400`
        Токен операции передаётся path-параметром, а не полем тела, поэтому имя поля к кодам
        не добавляется. Токен неверной длины отдельно не проверяется и отклоняется так же, как неизвестный, — `OperationInvalid`.
        - `OperationInvalid` — токен операции неизвестен, истёк или уже использован;
        - `OperationIsNotConfirmed` — операция ещё не подтверждена: сначала нужно пройти
          подтверждение через `PATCH /v1/operation/confirm`;
        - `OperationAlreadyExpired` — срок жизни операции истёк, её нужно создавать заново;

        ### Причины ответа `403`
        - указанная операция принадлежит другому пользователю;
        - токен указывает на операцию другого типа, а не на установку TOTP генератора
          (`POST /v1/security/totp`);
        - общие причины отказа — см. «Аутентификация и доступ» в описании API;
      operationId: renderTotpGeneratorQr
      tags:
        - Auth.Security
      x-auth-scopes:
        - any-users
      parameters:
        - $ref: '#/components/parameters/Auth.Security.Request.Path.Token'
      responses:
        '200':
          description: QR-код TOTP генератора (изображение для сканирования приложением 2FA)
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Api.ResponseJson.Error400'
        '401':
          $ref: '#/components/responses/Api.ResponseJson.Error401'
        '403':
          $ref: '#/components/responses/Api.ResponseJson.Error403'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/security/apply-totp:
    post:
      summary: Auth/SC/R4d. Метод проверяет TOTP-код и привязывает генератор, выдавая аварийные коды
      description: |-
        Пользователь вводит код из TOTP-приложения для подтверждения владения генератором.
        При успехе генератор привязывается, 2FA по TOTP включается и единоразово возвращается
        набор одноразовых аварийных кодов (их нужно сохранить — повторно они не показываются).

        Включение 2FA отзывает все незавершённые операции пользователя — см. описание API.

        ### Влияние на сессии
        Сессии и токены не затрагиваются — см. описание API.

        ### Значения `code` в ответе `400`
        - `ValidateError/token` — токен операции не указан или не проходит проверку схемы;
        - `ValidateError/totp_code` — TOTP код не указан или это не 6 цифр;
        - `TOTPCodeIsIncorrect/totp_code` — TOTP код не совпал с кодом, ожидаемым для секрета операции;
        - `OperationInvalid/token` — токен операции неизвестен, истёк или уже использован;
        - `OperationIsNotConfirmed/token` — операция ещё не подтверждена: сначала нужно пройти
          подтверждение через `PATCH /v1/operation/confirm`;
        - `OperationAlreadyExpired/token` — срок жизни операции истёк, её нужно создавать заново;

        ### Причины ответа `403`
        - указанная операция принадлежит другому пользователю;
        - токен указывает на операцию другого типа, а не на установку TOTP генератора
          (`POST /v1/security/totp`);
        - общие причины отказа — см. «Аутентификация и доступ» в описании API;

        ### Причины ответа `409`
        - 2FA была включена после создания операции (например, применён пароль как второй фактор):
          активный второй фактор не перезаписывается, его нужно сначала отключить
          через `POST /v1/security/disable2fa`;
      operationId: applyTotpGenerator
      tags:
        - Auth.Security
      x-auth-scopes:
        - any-users
      requestBody:
        required: true
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/Auth.Security.Request.Model.ApplyTotpGenerator'
      responses:
        '200':
          description: TOTP-генератор привязан, возвращены аварийные коды
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Auth.Security.Response.RecoveryCodes'
        '400':
          $ref: '#/components/responses/Api.ResponseJson.Error400'
        '401':
          $ref: '#/components/responses/Api.ResponseJson.Error401'
        '403':
          $ref: '#/components/responses/Api.ResponseJson.Error403'
        '409':
          $ref: '#/components/responses/Api.ResponseJson.Error409'
        '422':
          $ref: '#/components/responses/Api.ResponseJson.Error422'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/security/recovery-codes:
    post:
      summary: Auth/SC/R5a. Метод создания операции перевыпуска одноразовых аварийных кодов
      description: |-
        Метод предназначен для перевыпуска набора одноразовых аварийных кодов текущего пользователя
        без смены второго фактора (например, когда коды заканчиваются). Требует включённую 2FA.

        ### Алгоритм перевыпуска аварийных кодов:
        1. Отправляется код подтверждения на текущий емаил;
        2. Пользователь указывает полученный код и подтверждает перевыпуск (`PATCH /v1/operation/confirm`);
        3. Пользователю предлагается ввести пароль или TOTP код;
        4. После подтверждения пользователь применяет операцию методом `POST /v1/security/apply-recovery-codes`,
           который заменяет набор аварийных кодов на новый и единоразово возвращает его
           (старые коды становятся недействительными);
        5. На текущий емаил отправляется уведомление, что аварийные коды были перевыпущены;

        Аварийный код не принимается здесь ни на одном шаге — ни вместо кода с емаила, ни вместо
        второго фактора. Перевыпуск заменяет сам набор аварийных кодов, поэтому требует предъявить
        оба постоянных элемента: доступ к емаилу и второй фактор. Если второй фактор утерян, набор
        восстанавливается отключением 2FA и повторным её включением, а не перевыпуском.
        Предъявленный здесь аварийный код отклоняется как неверный и при этом не расходуется.

        ### Причины ответа `403`
        - общие причины отказа — см. «Аутентификация и доступ» в описании API;

        ### Причины ответа `409`
        - 2FA аутентификация выключена, перевыпускать аварийные коды нечему;
      operationId: regenerateUser2faRecoveryCodes
      tags:
        - Auth.Security
      x-auth-scopes:
        - any-users
      responses:
        '200':
          $ref: '#/components/responses/Auth.ResponseJson.WaitingConfirmOperation'
        '401':
          $ref: '#/components/responses/Api.ResponseJson.Error401'
        '403':
          $ref: '#/components/responses/Api.ResponseJson.Error403'
        '409':
          $ref: '#/components/responses/Api.ResponseJson.Error409'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/security/apply-recovery-codes:
    post:
      summary: Auth/SC/R5b. Метод применяет подтверждённую операцию перевыпуска и выдаёт новые аварийные коды
      description: |-
        Метод завершает перевыпуск аварийных кодов после подтверждения операции, созданной методом
        `POST /v1/security/recovery-codes`. Набор аварийных кодов заменяется на новый и единоразово
        возвращается (старые коды становятся недействительными, новые нужно сохранить — повторно
        они не показываются).

        ### Влияние на сессии
        Сессии и токены не затрагиваются — см. описание API.

        ### Значения `code` в ответе `400`
        - `ValidateError/token` — токен операции не указан или не проходит проверку схемы;
        - `OperationInvalid/token` — токен операции неизвестен, истёк или уже использован;
        - `OperationIsNotConfirmed/token` — операция ещё не подтверждена: сначала нужно пройти
          подтверждение через `PATCH /v1/operation/confirm`;
        - `OperationAlreadyExpired/token` — срок жизни операции истёк, её нужно создавать заново;

        ### Причины ответа `403`
        - указанная операция принадлежит другому пользователю;
        - токен указывает на операцию другого типа, а не на перевыпуск аварийных кодов
          (`POST /v1/security/recovery-codes`);
        - общие причины отказа — см. «Аутентификация и доступ» в описании API;

        ### Причины ответа `409`
        - 2FA была отключена после создания операции: перевыпускать аварийные коды нечему;
      operationId: applyUser2faRecoveryCodes
      tags:
        - Auth.Security
      x-auth-scopes:
        - any-users
      requestBody:
        required: true
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/Auth.Security.Request.Model.ApplyByToken'
      responses:
        '200':
          description: Аварийные коды перевыпущены, возвращён новый набор
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Auth.Security.Response.RecoveryCodes'
        '400':
          $ref: '#/components/responses/Api.ResponseJson.Error400'
        '401':
          $ref: '#/components/responses/Api.ResponseJson.Error401'
        '403':
          $ref: '#/components/responses/Api.ResponseJson.Error403'
        '409':
          $ref: '#/components/responses/Api.ResponseJson.Error409'
        '422':
          $ref: '#/components/responses/Api.ResponseJson.Error422'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/security/apply-operation:
    post:
      summary: Auth/SC/R6. Метод применяет подтверждённую пользователем операцию
      description: |-
        Метод предназначен для применения подтверждённой пользователем операции
        (изменение защищённого свойства пользователя, отмены 2FA и т.д.)

        У смены емаила этим методом применяется **вторая** операция цепочки — подтверждение
        владения новым адресом, созданное методом `POST /v1/security/apply-email`. Именно здесь
        емаил аккаунта меняется на новый, а на прежний адрес уходит уведомление.

        ### Влияние на сессии
        Сессии и токены не затрагиваются — см. описание API.

        ### Значения `code` в ответе `400`
        - `ValidateError/token` — токен операции не указан или не проходит проверку схемы;
        - `OperationInvalid/token` — токен операции неизвестен, истёк или уже использован;
        - `OperationIsNotConfirmed/token` — операция ещё не подтверждена: сначала нужно пройти
          подтверждение через `PATCH /v1/operation/confirm`;
        - `OperationAlreadyExpired/token` — срок жизни операции истёк, её нужно создавать заново;
        - `EmailAlreadyExists` — применяется смена емаила, а новый адрес успели занять за время
          жизни операции; смену нужно начинать заново с другим адресом. Ошибка не привязана
          к полю: в запросе передаётся только токен;

        Применение отключения 2FA отзывает все незавершённые операции пользователя — см. описание API.

        Тип операции проверяется раньше её подтверждённости, поэтому токен операции чужого типа
        даёт `403`, а не `OperationIsNotConfirmed`. Токен операции, которую метод применять должен,
        но её обработчик в этом развёртывании не подключён, даёт `500` (ошибка конфигурации сервера).

        ### Причины ответа `403`
        - указанная операция принадлежит другому пользователю;
        - токен указывает на операцию, которую этот метод не применяет (применяются только
          подтверждение нового емаила, смена телефона и отключение 2FA; у остальных операций
          свои завершающие методы — `POST /v1/security/apply-*`, `POST /v1/session`);
        - общие причины отказа — см. «Аутентификация и доступ» в описании API;
      operationId: applyUserOperation
      tags:
        - Auth.Security
      x-auth-scopes:
        - any-users
      requestBody:
        required: true
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/Auth.Security.Request.Model.ApplyByToken'
      responses:
        '204':
          description: Указанная пользователем операция была применена
        '400':
          $ref: '#/components/responses/Api.ResponseJson.Error400'
        '401':
          $ref: '#/components/responses/Api.ResponseJson.Error401'
        '403':
          $ref: '#/components/responses/Api.ResponseJson.Error403'
        '422':
          $ref: '#/components/responses/Api.ResponseJson.Error422'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/security/disable2fa:
    post:
      summary: Auth/SC/R7. Метод создания операции отключения 2FA аутентификацию пользователя
      description: |-
        Метод предназначен для создания операции отключения 2FA аутентификации текущего пользователя.

        ### Алгоритм отключения 2FA аутентификации пользователя (если 2FA включена):
        1. `POST /v1/security/disable2fa` — отправляется код подтверждения на текущий емаил;
        2. Пользователь указывает полученный код и подтверждает операцию (`PATCH /v1/operation/confirm`);
        3. Пользователю предлагается ввести пароль или TOTP код;
        4. Пользователь применяет подтверждённую операцию методом `POST /v1/security/apply-operation` —
          2FA аутентификация отключается;
        5. На текущий емаил отправляется уведомление, что 2FA аутентификация отключена;

        Отключение 2FA отзывает все незавершённые операции пользователя — см. описание API.

        Аварийный код принимается только вместо второго фактора (шаг 3) и не принимается вместо кода
        с емаила (шаг 2): комбинация «пароль/TOTP + аварийный код» отклоняется. Причина в том, что
        после снятия 2FA аккаунт зависит только от почты, поэтому владение ею и требуется предъявить.
        Так что если доступ ко второму фактору временно невозможен или он был утерян, снятие
        подтверждается кодом с емаила плюс одним из аварийных кодов, выданных при включении 2FA или
        при их перевыпуске. Предъявленный вместо кода с емаила аварийный код отклоняется как неверный
        и при этом не расходуется.

        ### Причины ответа `403`
        - общие причины отказа — см. «Аутентификация и доступ» в описании API;

        ### Причины ответа `409`
        - 2FA аутентификация уже отключена, отключать нечего;
      operationId: disableUser2fa
      tags:
        - Auth.Security
      x-auth-scopes:
        - any-users
      responses:
        '200':
          $ref: '#/components/responses/Auth.ResponseJson.WaitingConfirmOperation'
        '401':
          $ref: '#/components/responses/Api.ResponseJson.Error401'
        '403':
          $ref: '#/components/responses/Api.ResponseJson.Error403'
        '409':
          $ref: '#/components/responses/Api.ResponseJson.Error409'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/sessions:
    get:
      summary: Auth/SES/R1. Метод получения списка открытых сессий пользователя
      description: |-
        Метод предназначен для получения из БД списка открытых сессий пользователя.

        По умолчанию возвращаются сессии realm'а предъявленного access-токена. Query-параметром
        `realm` можно запросить сессии другого realm'а — при условии, что пользователь к нему
        привязан.

        ### Значения `code` в ответе `400`
        - `ValidateError/realm` — параметр не проходит проверку схемы (в т.ч. когда указанный
          realm не входит в список realm'ов приложения); пустое `?realm=` не эквивалентно
          отсутствию параметра и валидацию не проходит;

        ### Причины ответа `403`
        - пользователь не привязан к запрошенному realm'у;
        - общие причины отказа — см. «Аутентификация и доступ» в описании API;
      operationId: getUserSessions
      tags:
        - Auth.Sessions
      x-auth-scopes:
        - any-users
      parameters:
        - $ref: '#/components/parameters/Auth.Sessions.Request.Query.Realm'
      responses:
        '200':
          description: Сформирован ответ со списком открытых сессий пользователя
          content:
            application/json;charset=UTF-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Auth.Sessions.Response.Model.UserSession'
        '400':
          $ref: '#/components/responses/Api.ResponseJson.Error400'
        '401':
          $ref: '#/components/responses/Api.ResponseJson.Error401'
        '403':
          $ref: '#/components/responses/Api.ResponseJson.Error403'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
  /v1/sessions/close:
    post:
      summary: Auth/SES/R2. Метод закрытия указанных сессий пользователя
      description: |-
        Метод предназначен для закрытия указанных открытых сессий пользователя.

        Метод идемпотентен: чужие и уже закрытые сессии из списка молча игнорируются.

        ### Значения `code` в ответе `400`
        - `ValidateError/session_ids` — список не указан, пуст, длиннее 64 элементов либо элемент
          не является 8-символьным hex-идентификатором (`0-9a-f`, без префикса `0x`);

        ### Причины ответа `403`
        - общие причины отказа — см. «Аутентификация и доступ» в описании API;
      operationId: closeUserSessions
      tags:
        - Auth.Sessions
      x-auth-scopes:
        - any-users
      requestBody:
        required: true
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/Auth.Sessions.Request.Model.CloseSessions'
      responses:
        '204':
          description: Указанные сессии пользователя были закрыты
        '400':
          $ref: '#/components/responses/Api.ResponseJson.Error400'
        '401':
          $ref: '#/components/responses/Api.ResponseJson.Error401'
        '403':
          $ref: '#/components/responses/Api.ResponseJson.Error403'
        '422':
          $ref: '#/components/responses/Api.ResponseJson.Error422'
        '500':
          $ref: '#/components/responses/Api.ResponseJson.Error5xx'
components:
  securitySchemes:
    bearerAuth:
      description: https://www.rfc-editor.org/rfc/rfc6750
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Api.Request.Header.AcceptLanguage:
      description: |-
        Предпочтительный язык пользователя
        (https://developer.mozilla.org/ru/docs/Web/HTTP/Headers/Accept-Language)
        Невалидный параметр игнорируется, поведение не меняет.
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
      example: ru;q=0.9, fr-CH, fr;q=0.8, en;q=0.7, *;q=0.5
    Api.Request.Header.AcceptTimeZone:
      description: |-
        Предпочтительный часовой пояс пользователя. Стандартного заголовка для часового пояса нет,
        поэтому введён свой, по образцу Accept-Language.
        Первый сегмент без "=" — IANA-имя пояса, остальные сегменты — параметры offset (смещение
        относительно UTC в формате ±HH:MM) и dst (признак летнего времени, 0 или 1). Любая часть
        необязательна: параметры служат запасным путём на случай, когда имя приложению неизвестно,
        и позволяют подобрать по смещению ближайший из его поясов.
        Формат строгий: пробелы в значении не допускаются нигде — ни вокруг сегментов, ни вокруг "=".
        Невалидный параметр игнорируется, поведение не меняет.
      name: X-Accept-Time-Zone
      in: header
      required: false
      schema:
        type: string
      example: Europe/Moscow;offset=+03:00;dst=0
    Api.Request.Query.Language:
      description: |-
        Язык пользователя (BCP 47, напр. ru-RU), на нём отдаются текстовые сообщения и уведомления.
        Приоритет применения языка:
          1. query-параметр lang (этот параметр) — наивысший приоритет, разовое переопределение на запрос;
          2. язык из действующего access токена — для авторизованных запросов;
          3. заголовок Accept-Language (список с весами q);
          4. язык системы по умолчанию.
        Первые два источника строгие: значение принимается только при точном совпадении с одним
        из поддерживаемых приложением языков, подбор ближайшего здесь не выполняется (напр. fr-CH
        при поддержке fr совпадением не считается). По заголовку Accept-Language, наоборот,
        подбирается ближайший поддерживаемый язык.
        Невалидный/неподдерживаемый источник пропускается — применяется следующий по приоритету.
        Невалидный параметр игнорируется, поведение не меняет.
      name: lang
      in: query
      required: false
      schema:
        type: string
        maxLength: 5
      example: ru-RU
    Api.Request.Query.TimeZone:
      description: |-
        Часовой пояс пользователя (IANA-имя, напр. Europe/Moscow), в нём отдаются все сущностные
        даты/время.
        Приоритет применения часового пояса:
          1. query-параметр tz (этот параметр) — наивысший приоритет, разовое переопределение на запрос;
          2. часовой пояс из действующего access токена — для авторизованных запросов;
          3. заголовок X-Accept-Time-Zone;
          4. часовой пояс системы по умолчанию.
        Первые два источника строгие: значение принимается только при точном совпадении с одним
        из поясов, предоставляемых приложением, подбор по смещению здесь не выполняется.
        По заголовку X-Accept-Time-Zone, наоборот, при неизвестном имени подбирается ближайший
        по смещению пояс.
        Невалидный/неподдерживаемый источник пропускается — применяется следующий по приоритету.
        Невалидный параметр игнорируется, поведение не меняет.
      name: tz
      in: query
      required: false
      schema:
        type: string
        maxLength: 64
      example: Europe/Moscow
    Auth.Request.Header.Web.UseCookie:
      description: Признак, что значение refreshToken следует сохранять в куке RTID (без доступа к ней через js)
      name: X-Use-Cookie
      in: header
      required: false
      schema:
        type: boolean
      example: true
    Auth.Request.Cookie.Web.RefreshToken:
      name: RTID
      in: cookie
      required: false
      schema:
        description: Используется платформой WEB
        type: string
        maxLength: 128
      example: 02fb5463db25b91568a1801dc0974b1d50cb1f3bc817f2be3a4b357929cee704
    Auth.Security.Request.Path.Token:
      description: Токен операции, которая подтверждена пользователем
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 64
        maxLength: 128
      example: b1d50cb1f3bc817f2be3a4b357929cee70402fb5463db25b91568a1801dc0974
    Auth.Sessions.Request.Query.Realm:
      description: |-
        Realm, чьи сессии нужно вернуть.
        Необязателен: если параметр в запросе отсутствует, берётся realm предъявленного access-токена.
        Указанный явно realm должен входить в список realm'ов приложения, а пользователь -
        быть к нему привязан; пустое значение является невалидным.
      name: realm
      in: query
      required: false
      schema:
        type: string
        minLength: 4
        maxLength: 32
      example: domain_name/user_group
  schemas:
    Auth.Request.Model.CreateUser:
      type: object
      required:
        - realm
        - user_email
      properties:
        realm:
          description: Область, пространство, где должен быть зарегистрирован пользователь
          type: string
          minLength: 4
          maxLength: 32
          example: domain_name/user_group
        user_email:
          description: Eмаил, который будет использован в качестве логина при создании пользователя
          type: string
          format: email
          minLength: 7
          maxLength: 64
          example: user-email@example.com
    Auth.Response.Model.ConfirmOperationState:
      type: object
      required:
        - remaining_attempts
        - expires_in
      properties:
        remaining_attempts:
          description: Оставшееся количество попыток ввода кода подтверждения
          type: integer
          minimum: 0
          example: 2
        remaining_resends:
          description: |-
            Оставшееся количество повторных отправок кода подтверждения; 0 означает,
            что отправки исчерпаны. Отсутствует вместе с resends_in, если повторные отправки
            не применимы (`PASSWORD`, `TOTP`, `RECOVERY`)
          type: integer
          minimum: 0
          example: 1
        resends_in:
          description: |-
            Количество оставшихся секунд по истечении которых можно сделать повторную отправку
            кода подтверждения; 0 означает, что её можно сделать прямо сейчас.
            Отсутствует вместе с remaining_resends, если повторные отправки не применимы
            (`PASSWORD`, `TOTP`, `RECOVERY`)
          type: integer
          minimum: 0
          example: 1
        expires_in:
          description: Количество оставшихся секунд до истечения срока действия подтверждения операции
          type: integer
          minimum: 0
          example: 1
    Auth.Enum.ConfirmMethod:
      description: |-
        Метод подтверждения подлинности пользователя:
        - EMAIL - электронный адрес;
        - PHONE - телефон (зарезервировано: не реализовано);
        - PASSWORD - пароль;
        - TOTP - генератор одноразовых паролей;
        - RECOVERY - одноразовый аварийный код; встречается только последним звеном цепочки
          и только у операций, созданных методами `.../recovery`;
      type: string
      enum:
        - EMAIL
        - PHONE
        - PASSWORD
        - TOTP
        - RECOVERY
      example: EMAIL
    Auth.Response.Model.WaitingConfirmOperation:
      allOf:
        - $ref: '#/components/schemas/Auth.Response.Model.ConfirmOperationState'
        - type: object
          required:
            - token
            - confirm_method
          properties:
            token:
              description: |-
                Токен операции, с помощью которой проводится процедура подтверждения подлинности пользователя.
                Токен принадлежит текущему звену цепочки подтверждений: при переходе к следующему звену
                выдаётся новый токен, а предыдущий сразу перестаёт действовать. Поэтому клиент всегда
                работает с токеном последнего полученного звена - им же вызывается и завершающий метод
                операции (`POST /v1/security/apply-*`)
              type: string
              maxLength: 128
              example: b1d50cb1f3bc817f2be3a4b357929cee70402fb5463db25b91568a1801dc0974
            confirm_method:
              $ref: '#/components/schemas/Auth.Enum.ConfirmMethod'
            message:
              description: |-
                Человекочитаемое сообщение о том, что операция требует подтверждения,
                текст задаёт хост-приложение и зависит от сценария
              type: string
              example: Для входа в систему необходимо ввести код подтверждения, отправленный на ваш емаил/телефон
    Api.Response.Model.ErrorAttribute:
      description: DTO пользовательской ошибки 400
      type: object
      required:
        - code
        - detail
      properties:
        code:
          description: |-
            Идентификатор ошибки. Принимает одну из двух форм:
            - `ErrorCode` — запрос отклонён по существу, а не по значению конкретного поля;
              поля формы у такой ошибки нет;
            - `ErrorCode/field_name` — ошибка относится к значению поля запроса. Суффикс после первого
              `/` совпадает с именем поля в JSON, поэтому такую ошибку клиент может показать прямо
              под соответствующим полем формы, а префикс объясняет причину отказа;

            Отсюда правило для клиента: разделить значение по первому `/`; если суффикс есть и
            совпал с полем формы — показать ошибку под этим полем, иначе (суффикса нет либо такого
            поля в форме нет) показать общим уведомлением. Значения, возможные у конкретного метода,
            перечислены в его описании.
          type: string
          example: ValidateError/user_email
        detail:
          description: Описание ошибки
          type: string
          example: Атрибут не может быть пустым
    Api.Response.Model.ErrorList:
      description: DTO списка пользовательских ошибок 400
      type: array
      items:
        $ref: '#/components/schemas/Api.Response.Model.ErrorAttribute'
    Api.Response.Model.Error400:
      description: DTO ошибки 400
      type: object
      required:
        - status
        - instance
        - errors
        - time
      properties:
        status:
          description: Код HTTP статуса (дублируется из заголовка)
          type: integer
          example: 400
        instance:
          description: Метод и URL запроса
          type: string
          example: POST /users/123456
        errors:
          $ref: '#/components/schemas/Api.Response.Model.ErrorList'
        time:
          description: Время возникновения ошибки с точностью до миллисекунд (UTC)
          type: string
          format: date-time
          example: '2020-01-01T12:00:00.000Z'
    Api.Response.Model.ErrorDetails:
      description: DTO следующих ошибок - 401, 403, 404, 409, 422, 429, 5XX. RFC 9457 (Problem Details for HTTP APIs)
      type: object
      required:
        - title
        - status
        - detail
        - instance
        - time
      properties:
        type:
          description: Ссылки на ресурс с описанием проблемы данного типа
          type: string
          default: about:blank
          example: https://api.example.com/problem/type
        title:
          description: Краткое описание проблемы, понятное человеку
          type: string
          example: Resource not found
        status:
          description: Код HTTP статуса (дублируется из заголовка)
          type: integer
          example: 404
        detail:
          description: Описание конкретно возникшей ошибки, понятное человеку
          type: string
          example: Resource [User] with id = [123456] not found. You MUST use PUT to add a resource instead of GET
        instance:
          description: Метод и URL запроса
          type: string
          example: POST /users/123456
        time:
          description: Время возникновения ошибки с точностью до миллисекунд (UTC)
          type: string
          format: date-time
          example: '2020-01-01T12:00:00.000Z'
        error_trace_id:
          description: Идентификатор экземпляра конкретной ошибки
          type: string
          example: 5add1be1-90ab5d42-02fa8b1f-672503f2
    Auth.Request.Model.AuthorizeUser:
      type: object
      required:
        - realm
        - user_login
      properties:
        realm:
          description: Область, пространство, где должен быть авторизован пользователь
          type: string
          minLength: 4
          maxLength: 32
          example: domain_name/user_group
        user_login:
          description: Eмаил/телефон пользователя зарегистрированного в системе
          type: string
          minLength: 7
          maxLength: 64
          example: user-email@example.com
    Auth.Request.Model.LoginByToken:
      type: object
      required:
        - token
      properties:
        token:
          description: |-
            Токен операции входа или регистрации пользователя - токен последнего полученного
            звена цепочки подтверждений (см. описание метода)
          type: string
          minLength: 64
          maxLength: 128
          example: b1d50cb1f3bc817f2be3a4b357929cee70402fb5463db25b91568a1801dc0974
        secret:
          description: |-
            Пароль, одноразовый пароль, код подтверждения, высланный на емаил/телефон, либо один
            из аварийных кодов — если текущее звено цепочки подтверждений его допускает.
            Указывается, только пока в операции остаётся неподтверждённое звено; по полностью
            подтверждённой операции поле в теле не указывается (см. описание метода);
            пустая строка является невалидным значением.
            Границы `4..32` — общий диапазон размера на все форматы разом; фактический размер
            задаёт `confirm_method` текущего звена:
            - EMAIL - цифровой код, 4..8 символов;
            - PHONE - цифровой код, 4..8 символов (зарезервировано);
            - PASSWORD - 8..32 символа;
            - TOTP - 6-значный цифровой код;
            - RECOVERY - 8..32 символа;
          type: string
          minLength: 4
          maxLength: 32
          example: '183947'
    Auth.Response.Model.SuccessAccess:
      type: object
      required:
        - access_token
        - expires_in
      properties:
        access_token:
          description: |-
            Access токен. В режиме access_type=session — непрозрачная строка, проверяемая на сервере
            (отзыв мгновенный). В режиме access_type=jwt — подписанный JWT (HS/RS/ES) с короткоживущими
            claim'ами sub/sid/aud/scope/iss/iat/jti и заголовком kid; проверяется по подписи (для RS/ES
            публичные ключи публикуются хостом на /.well-known/jwks.json),
            отзыв реализован коротким TTL: при DELETE/повторном refresh refresh-линия гасится сразу,
            а сам access остаётся валиден до истечения своего короткого срока жизни.
          type: string
          example: 425b91568a1801dc02fb5463db17f2be3a4b357929cee700974b1d50cb1f3bc8
        expires_in:
          description: |-
            Оставшееся время жизни access токена в секундах. В режиме access_type=jwt значение короткое
            (несколько минут), так как именно короткий TTL служит механизмом отзыва access.
          type: integer
          example: 1800
        refresh_token:
          description: |-
            Refresh токен. Возвращается в этом поле, только если он не передаётся кукой RTID
            в заголовке Set-Cookie (см. описание метода)
          type: string
          example: 02fb5463db25b91568a1801dc0974b1d50cb1f3bc817f2be3a4b357929cee704
        message:
          description: Человекочитаемое сообщение об успешном доступе, текст задаёт хост-приложение и зависит от сценария
          type: string
          example: Доступ к вашему аккаунту разрешён
    Auth.Request.Model.ContinueSession:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          description: Ранее выданный при авторизации/продолжении сессии refreshToken
          type: string
          minLength: 64
          maxLength: 128
          example: b1d50cb1f3bc817f2be3a4b357929cee70402fb5463db25b91568a1801dc0974
    Auth.Enum.UserAuth2fa:
      description: |-
        Тип двухфакторной аутентификации пользователя:
        - NONE - отсутствует (отключена);
        - PASSWORD - дополнительная авторизация по паролю;
        - TOTP - дополнительная авторизация по TOTP;
      type: string
      enum:
        - NONE
        - PASSWORD
        - TOTP
      example: PASSWORD
    Auth.Field.DateTimeLastLoggedAt:
      description: Дата и время последнего входа пользователя в часовом поясе пользователя (RFC3339 со смещением; по умолчанию UTC)
      type: string
      format: date-time
      example: '2020-01-01T15:00:00+03:00'
    Api.Field.DateTimeCreatedAt:
      description: Дата и время создания записи в часовом поясе пользователя (RFC3339 со смещением; по умолчанию UTC)
      type: string
      format: date-time
      example: '2020-01-01T15:00:00+03:00'
    Api.Field.DateTimeUpdatedAt:
      description: Дата и время обновления записи в часовом поясе пользователя (RFC3339 со смещением; по умолчанию UTC)
      type: string
      format: date-time
      example: '2020-01-01T15:00:00+03:00'
    Auth.Response.Model.UserRealm:
      type: object
      required:
        - name
        - user_kind
        - created_at
        - updated_at
      properties:
        name:
          type: string
          maxLength: 32
          example: domain_name/user_group
        user_kind:
          type: string
          maxLength: 16
          example: standard
        last_location:
          description: Местоположение последнего входа или IP
          type: string
          example: Saint-Petersburg, RU
        last_logged_at:
          $ref: '#/components/schemas/Auth.Field.DateTimeLastLoggedAt'
        created_at:
          $ref: '#/components/schemas/Api.Field.DateTimeCreatedAt'
        updated_at:
          $ref: '#/components/schemas/Api.Field.DateTimeUpdatedAt'
    Auth.Enum.OperationType:
      description: |-
        Тип защищённой операции личного кабинета, ожидающей подтверждения либо применения:
        - CHANGE_EMAIL - смена емаила, шаг 1: подтверждение владения аккаунтом;
        - CHANGE_EMAIL_CONFIRM - смена емаила, шаг 2: подтверждение владения новым адресом;
        - CHANGE_PHONE - смена телефона;
        - CHANGE_PASSWORD - установка пароля (2FA);
        - CHANGE_TOTP - установка TOTP генератора (2FA);
        - REGENERATE_RECOVERY - перевыпуск одноразовых аварийных кодов;
        - DISABLE_2FA - отключение 2FA;
      type: string
      enum:
        - CHANGE_EMAIL
        - CHANGE_EMAIL_CONFIRM
        - CHANGE_PHONE
        - CHANGE_PASSWORD
        - CHANGE_TOTP
        - REGENERATE_RECOVERY
        - DISABLE_2FA
      example: CHANGE_EMAIL_CONFIRM
    Auth.Enum.OperationStatus:
      description: |-
        Текущий статус защищённой операции:
        - OPENED - открыта, ожидает подтверждения (`PATCH /v1/operation/confirm`);
        - CONFIRMED - подтверждена, ожидает применения завершающим методом операции
          (`POST /v1/security/apply-*`);
      type: string
      enum:
        - OPENED
        - CONFIRMED
      example: OPENED
    Auth.Response.Model.PendingOperation:
      description: |-
        Защищённая операция пользователя, ожидающая подтверждения либо применения.
        Токеном операции она подтверждается (`PATCH /v1/operation/confirm`), при необходимости
        переотправляет код (`PATCH /v1/operation/resend`), отзывается (`PATCH /v1/operation/revoke`)
        и применяется завершающим методом (`POST /v1/security/apply-*`).

        У операции, ожидающей подтверждения (`status` = `OPENED`), отдаются также метод текущего
        звена (`confirm_method`) и счётчики (`remaining_attempts`, `remaining_resends`, `resends_in`) —
        те же, что в `WaitingConfirmOperation`.
        У подтверждённой операции (`CONFIRMED`) подтверждать нечего, и этих полей нет.
      type: object
      required:
        - token
        - type
        - expires_at
        - status
      properties:
        token:
          description: |-
            Токен операции — токен **последнего** звена цепочки подтверждений: именно им операция
            подтверждается, переотправляет код, отзывается и применяется
          type: string
          maxLength: 128
          example: b1d50cb1f3bc817f2be3a4b357929cee70402fb5463db25b91568a1801dc0974
        type:
          $ref: '#/components/schemas/Auth.Enum.OperationType'
        extra_value:
          description: |-
            Значение операции, отображаемое пользователю: новый емаил у операций смены адреса
            (`CHANGE_EMAIL`, `CHANGE_EMAIL_CONFIRM`) и новый телефон у `CHANGE_PHONE`; у остальных
            операций поле отсутствует
          type: string
          maxLength: 128
          example: new-user-email@example.com
        expires_at:
          description: Дата и время, когда операция перестанет действовать.
          type: string
          format: date-time
          example: '2020-01-01T15:00:00+03:00'
        status:
          $ref: '#/components/schemas/Auth.Enum.OperationStatus'
        confirm_method:
          description: Метод подтверждения текущего звена. Отдаётся только при `status` = `OPENED`
          allOf:
            - $ref: '#/components/schemas/Auth.Enum.ConfirmMethod'
        remaining_attempts:
          description: Оставшееся количество попыток ввода кода подтверждения
          type: integer
          minimum: 0
          example: 2
        remaining_resends:
          description: |-
            Оставшееся количество повторных отправок кода подтверждения; 0 означает,
            что отправки исчерпаны. Отсутствует вместе с resends_in, если повторные отправки
            не применимы (`PASSWORD`, `TOTP`, `RECOVERY`)
          type: integer
          minimum: 0
          example: 1
        resends_in:
          description: |-
            Количество оставшихся секунд по истечении которых можно сделать повторную отправку
            кода подтверждения; 0 означает, что её можно сделать прямо сейчас.
            Отсутствует вместе с remaining_resends, если повторные отправки не применимы
            (`PASSWORD`, `TOTP`, `RECOVERY`)
          type: integer
          minimum: 0
          example: 0
    Auth.Enum.UserStatus:
      description: |-
        Текущий статус пользователя:
        - DRAFT - черновик;
        - ENABLED - используется;
        - DISABLED - отключён (админом);
        - BLOCKED - заблокирован (системой);
      type: string
      enum:
        - DRAFT
        - ENABLED
        - DISABLED
        - BLOCKED
      example: ENABLED
    Auth.Response.Model.UserInfo:
      type: object
      required:
        - email
        - lang
        - tz
        - auth_2fa_type
        - realms
        - status
      properties:
        email:
          type: string
          format: email
          maxLength: 64
          example: user-email@example.com
        phone:
          type: string
          format: phone
          maxLength: 32
          example: +7 999 888 77 66
        lang:
          description: |-
            Язык пользователя, сохранённый в его профиле. Тексты в ответах формируются
            по языку, зафиксированному в access-токене, поэтому после смены настроек
            значения могут отличаться — до ближайшего продления сессии (`PATCH /v1/session`),
            повторный вход при этом не требуется.
          type: string
          maxLength: 5
          example: ru-RU
        tz:
          description: |-
            Часовой пояс пользователя (IANA-имя), сохранённый в его профиле.
            Даты/время в ответах форматируются по поясу, зафиксированному в access-токене,
            поэтому после смены настроек значения могут отличаться — до ближайшего продления
            сессии (`PATCH /v1/session`), повторный вход при этом не требуется.
          type: string
          maxLength: 64
          example: Europe/Moscow
        auth_2fa_type:
          $ref: '#/components/schemas/Auth.Enum.UserAuth2fa'
        recovery_codes_left:
          description: |-
            Количество неиспользованных одноразовых аварийных кодов. Ноль означает, что коды
            исчерпаны и их следует перевыпустить (`POST /v1/security/recovery-codes`).
            Поле отсутствует, если 2FA выключена (`auth_2fa_type`: `NONE`).
          type: integer
          minimum: 0
          example: 8
        realms:
          type: array
          items:
            $ref: '#/components/schemas/Auth.Response.Model.UserRealm'
        pending_operations:
          description: |-
            Действующие операции личного кабинета пользователя, ожидающие его подтверждения либо
            применения, в порядке их истечения. Отсутствует, если таких операций нет. Операции входа
            и регистрации сюда не попадают.
          type: array
          items:
            $ref: '#/components/schemas/Auth.Response.Model.PendingOperation'
        status:
          $ref: '#/components/schemas/Auth.Enum.UserStatus'
    Auth.Request.Model.ChangeUserSettings:
      type: object
      properties:
        lang:
          description: |-
            Язык (локаль) пользователя - код языка и необязательный код региона.
            Необязателен: если поле в теле отсутствует, то включается режим «авто» - язык
            определяется по самому запросу (см. описание метода), а не остаётся прежним.
            Указанный явно язык должен точно совпадать с одним из поддерживаемых приложением;
            пустая строка является невалидным значением.
          type: string
          minLength: 2
          maxLength: 5
          example: ru-RU
        tz:
          description: |-
            Часовой пояс пользователя (IANA-имя).
            Необязателен: если поле в теле отсутствует, то включается режим «авто» - пояс
            определяется по самому запросу (см. описание метода), а не остаётся прежним.
            Указанное явно имя должно точно совпадать с одним из часовых поясов поддерживаемых
            приложением; пустая строка является невалидным значением.
          type: string
          minLength: 3
          maxLength: 64
          example: Europe/Moscow
    Auth.Response.Model.UserSettings:
      type: object
      required:
        - lang
        - tz
      properties:
        lang:
          description: |-
            Язык (локаль) пользователя, который был сохранён.
            Если поле lang в запросе отсутствовало (режим «авто»), здесь возвращается
            подобранный язык
          type: string
          maxLength: 5
          example: ru-RU
        tz:
          description: |-
            Часовой пояс пользователя (IANA-имя), который был сохранён.
            Если поле tz в запросе отсутствовало (режим «авто»), здесь возвращается
            подобранный пояс
          type: string
          maxLength: 64
          example: Europe/Moscow
    Auth.Check.Request.Model.CheckLogin:
      type: object
      required:
        - realm
        - user_login
      properties:
        realm:
          description: Область, пространство, в котором проверяется логин
          type: string
          minLength: 4
          maxLength: 32
          example: domain_name/user_group
        user_login:
          description: Емаил или телефон, занятость которого проверяется
          type: string
          minLength: 7
          maxLength: 64
          example: user-email@example.com
    Auth.Check.Request.Model.CalcPasswordStrength:
      type: object
      required:
        - password
      properties:
        password:
          description: Проверяемый пароль
          type: string
          minLength: 8
          maxLength: 32
          example: L$QI.qA6eu7zG%7w
    Auth.Enum.PasswordStrength:
      description: |-
        Виды надёжности пароля:
        - NOT_RATED - пароль без оценки;
        - WEAK - слабый пароль;
        - MIDDLE - средний пароль;
        - STRONG - надёжный пароль;
        - THE_BEST - максимально надёжный пароль;
      type: string
      enum:
        - NOT_RATED
        - WEAK
        - MIDDLE
        - STRONG
        - THE_BEST
      example: STRONG
    Auth.Check.Response.Model.CalcPasswordStrength:
      type: object
      required:
        - strength
        - acceptable
      properties:
        strength:
          $ref: '#/components/schemas/Auth.Enum.PasswordStrength'
        acceptable:
          description: |-
            Проходит ли пароль порог надёжности, который применяет `POST /v1/security/password`
            при установке пароля как 2FA.
          type: boolean
          example: true
    Auth.Check.Response.GeneratedPassword:
      type: object
      required:
        - password
      properties:
        password:
          description: |-
            Сгенерированный пароль для пользователя.
            Его надёжность (см. Auth.Enum.PasswordStrength) всегда `THE_BEST`.
          type: string
          maxLength: 32
          example: L$QI.qA6eu7zG%7w
    Auth.Check.Enum.KeyType:
      description: |
        Тип криптографического ключа (JWK 'kty', RFC 7517):
        - RSA - RSA ключ
        - EC - ключ на эллиптических кривых
      type: string
      enum:
        - RSA
        - EC
    Auth.Check.Response.Model.Jwk:
      description: Публичный ключ в формате JWK (RFC 7517)
      type: object
      required:
        - kty
        - use
      properties:
        kty:
          $ref: '#/components/schemas/Auth.Check.Enum.KeyType'
        use:
          description: Назначение ключа (JWK 'use')
          type: string
          example: sig
        kid:
          description: Идентификатор ключа (JWT-заголовок 'kid')
          type: string
          example: 2026-key-01
        alg:
          description: Алгоритм подписи (JWK 'alg')
          type: string
          example: RS256
        'n':
          description: RSA - модуль (base64url)
          type: string
        e:
          description: RSA - публичная экспонента (base64url)
          type: string
        crv:
          description: EC - имя кривой
          type: string
          example: P-256
        x:
          description: EC - координата X (base64url)
          type: string
        'y':
          description: EC - координата Y (base64url)
          type: string
    Auth.Check.Response.Model.Jwks:
      description: Набор публичных ключей в формате JWKS (RFC 7517)
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Auth.Check.Response.Model.Jwk'
    Auth.Operation.Request.Model.ConfirmOperation:
      description: DTO подтверждения операции, которая инициирована пользователем
      type: object
      required:
        - token
        - secret
      properties:
        token:
          description: Токен для подтверждения операции
          type: string
          minLength: 64
          maxLength: 128
          example: b1d50cb1f3bc817f2be3a4b357929cee70402fb5463db25b91568a1801dc0974
        secret:
          description: |-
            Пароль, одноразовый пароль, код подтверждения, высланный на емаил/телефон, либо один
            из аварийных кодов — если текущее звено цепочки подтверждений его допускает.
            Границы `4..32` — общий диапазон размера на все форматы разом; фактический размер
            задаёт `confirm_method` текущего звена:
            - EMAIL - цифровой код, 4..8 символов;
            - PHONE - цифровой код, 4..8 символов (зарезервировано);
            - PASSWORD - 8..32 символа;
            - TOTP - 6-значный цифровой код;
            - RECOVERY - 8..32 символа;
          type: string
          minLength: 4
          maxLength: 32
          example: '183947'
    Auth.Operation.Request.Model.OperationToken:
      type: object
      required:
        - token
      properties:
        token:
          description: Токен операции, которая инициирована пользователем
          type: string
          minLength: 64
          maxLength: 128
          example: b1d50cb1f3bc817f2be3a4b357929cee70402fb5463db25b91568a1801dc0974
    Auth.Security.Request.Model.ChangeEmail:
      type: object
      required:
        - new_email
      properties:
        new_email:
          description: Новый емаил пользователя
          type: string
          format: email
          minLength: 7
          maxLength: 64
          example: new-user-email@example.com
    Auth.Security.Request.Model.ApplyByToken:
      type: object
      required:
        - token
      properties:
        token:
          description: Токен операции, которая подтверждена пользователем
          type: string
          minLength: 64
          maxLength: 128
          example: b1d50cb1f3bc817f2be3a4b357929cee70402fb5463db25b91568a1801dc0974
    Auth.Security.Request.Model.ChangePhone:
      type: object
      required:
        - new_phone
      properties:
        new_phone:
          description: Новый телефон пользователя
          type: string
          format: phone
          minLength: 10
          maxLength: 32
          example: +7 999 888 77 66
    Auth.Security.Request.Model.ChangePassword:
      type: object
      required:
        - new_password
      properties:
        new_password:
          description: Новый пароль пользователя
          type: string
          minLength: 8
          maxLength: 32
          example: L$QI.qA6eu7zG%7w
    Auth.Security.Response.RecoveryCodes:
      type: object
      required:
        - recovery_codes
      properties:
        recovery_codes:
          description: Набор одноразовых аварийных кодов, выданных при включении 2FA (по паролю или TOTP) либо при их перевыпуске
          type: array
          items:
            type: string
          example:
            - QW39L7R0-417X5FKV
            - 67DO040V-17K59ABP
    Auth.Security.Response.TotpSecret:
      type: object
      required:
        - secret
        - otpauth_uri
      properties:
        secret:
          description: |-
            Секрет TOTP генератора в Base32 - для ручного ввода в приложение 2FA аутентификации,
            когда сканировать QR-код нечем
          type: string
          minLength: 16
          maxLength: 128
          example: JBSWY3DPEHPK3PXP
        otpauth_uri:
          description: |-
            Ссылка otpauth:// с теми же параметрами, что закодированы в QR-коде: секрет, issuer
            и имя аккаунта. По ней приложение добавляет генератор без ручного ввода секрета
          type: string
          minLength: 16
          maxLength: 512
          example: otpauth://totp/example-app:user@example.com?issuer=example-app&secret=JBSWY3DPEHPK3PXP
    Auth.Security.Request.Model.ApplyTotpGenerator:
      type: object
      required:
        - token
        - totp_code
      properties:
        token:
          description: Токен операции, которая подтверждена пользователем
          type: string
          minLength: 64
          maxLength: 128
          example: b1d50cb1f3bc817f2be3a4b357929cee70402fb5463db25b91568a1801dc0974
        totp_code:
          description: 6-значный цифровой код, сгенерированный TOTP-приложением пользователя
          type: string
          minLength: 6
          maxLength: 6
          example: '183947'
    Auth.Field.DateTimeLastSeenAt:
      description: Дата и время последней активности сессии в часовом поясе пользователя (RFC3339 со смещением; по умолчанию UTC)
      type: string
      format: date-time
      example: '2020-01-01T15:00:00+03:00'
    Auth.Field.DateTimeExpiresAt:
      description: Дата и время протухания сессии в часовом поясе пользователя (RFC3339 со смещением; по умолчанию UTC)
      type: string
      format: date-time
      example: '2020-01-01T15:00:00+03:00'
    Auth.Sessions.Response.Model.UserSession:
      type: object
      required:
        - session_id
        - app_name
        - device_name
        - last_ip
        - created_at
        - last_seen_at
        - expires_at
        - is_current
      properties:
        session_id:
          description: Идентификатор открытой сессии
          type: string
          example: 1f3bc817
        app_name:
          description: Приложение, в котором открыта сессия
          type: string
          example: Web, Firefox
        device_name:
          description: Название устройства, на котором открыта сессия
          type: string
          example: Device 1
        last_ip:
          description: IP адрес последнего посещения
          type: string
          example: 95.165.1.1
        location:
          description: Местоположение (только если было вычислено)
          type: string
          example: Moscow, Russia
        created_at:
          $ref: '#/components/schemas/Api.Field.DateTimeCreatedAt'
        last_seen_at:
          $ref: '#/components/schemas/Auth.Field.DateTimeLastSeenAt'
        expires_at:
          $ref: '#/components/schemas/Auth.Field.DateTimeExpiresAt'
        is_current:
          description: Признак, что сессия является текущей
          type: boolean
          example: false
    Auth.Sessions.Request.Model.SessionID:
      description: Идентификатор сессии текущего пользователя - 8 шестнадцатеричных символов в нижнем регистре
      type: string
      minLength: 8
      maxLength: 8
      example: 1f3bc817
    Auth.Sessions.Request.Model.CloseSessions:
      description: DTO закрытия указанных сессий текущего пользователя
      type: object
      required:
        - session_ids
      properties:
        session_ids:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/Auth.Sessions.Request.Model.SessionID'
  responses:
    Auth.ResponseJson.WaitingConfirmOperation:
      description: |
        - Ожидается подтверждение регистрации пользователя
        - Ожидается подтверждение входа пользователя в систему
        - Ожидается подтверждение изменения значения защищённого поля
        - Ожидается подтверждение какой либо операции
      content:
        application/json;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Auth.Response.Model.WaitingConfirmOperation'
    Api.ResponseJson.Error400:
      description: Некорректные входные данные. Возвращается список атрибутов с ошибками
      content:
        application/json;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Api.Response.Model.Error400'
    Api.ResponseJson.Error403:
      description: Пользователю с текущими правами доступ отклонён
      content:
        application/problem+json;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Api.Response.Model.ErrorDetails'
    Api.ResponseJson.Error422:
      description: Тело запроса не удалось разобрать
      content:
        application/problem+json;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Api.Response.Model.ErrorDetails'
    Api.ResponseJson.Error429:
      description: |-
        Запрос корректен, но отклонён временно: повторить его следует позже.
        Срок повторной попытки - в заголовке `Retry-After` (если сервер может его назвать)
      headers:
        Retry-After:
          $ref: '#/components/headers/Api.Response.Header.RetryAfter'
      content:
        application/problem+json;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Api.Response.Model.ErrorDetails'
    Api.ResponseJson.Error5xx:
      description: Внутренняя ошибка сервера
      content:
        application/problem+json;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Api.Response.Model.ErrorDetails'
    Auth.ResponseJson.SuccessAccess:
      description: |
        - Пользователь успешно зарегистрирован в системе
        - Доступ к аккаунту пользователя разрешён
        - Refresh и Access токены сгенерированы на основе токена операции
        - Refresh и Access токены перегенерированы
      headers:
        Set-Cookie:
          $ref: '#/components/headers/Auth.Response.Cookie.Web.RefreshToken'
      content:
        application/json;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Auth.Response.Model.SuccessAccess'
    Auth.ResponseJson.Error400:
      description: Некорректный токен операции или код подтверждения
      content:
        application/json;charset=UTF-8:
          schema:
            allOf:
              - $ref: '#/components/schemas/Api.Response.Model.Error400'
              - type: object
                properties:
                  operation_state:
                    $ref: '#/components/schemas/Auth.Response.Model.ConfirmOperationState'
    Api.ResponseJson.Error401:
      description: Пользователь не был аутентифицирован
      content:
        application/problem+json;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Api.Response.Model.ErrorDetails'
    Auth.Check.ResponseJson.Jwks:
      description: Набор публичных JWT-ключей в формате JWKS (RFC 7517)
      content:
        application/json;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Auth.Check.Response.Model.Jwks'
    Api.ResponseJson.Error404:
      description: Запрашиваемый ресурс не был найден
      content:
        application/problem+json;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Api.Response.Model.ErrorDetails'
    Api.ResponseJson.Error409:
      description: Запрос отклонён текущим состоянием ресурса
      content:
        application/problem+json;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Api.Response.Model.ErrorDetails'
  headers:
    Api.Response.Header.RetryAfter:
      description: |-
        Через сколько секунд следует повторить запрос. Отдаётся при ответе `429`, когда запрос
        корректен, но отклонён временно (анти-спам троттл, исчерпанный ресурс сервера).
        Заголовок необязателен: если сервер не берётся назвать срок, он не отдаётся вовсе,
        и клиент выбирает задержку сам.
        Значение всегда целое число секунд (`delay-seconds` по RFC 9110); вторая допускаемая
        RFC форма - `HTTP-date` - этим API не используется.
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 600
    Auth.Response.Cookie.Web.RefreshToken:
      schema:
        description: |-
          Используется платформой WEB. Кука с refreshToken.
          Атрибуты по умолчанию: Path=/, Secure, HttpOnly, SameSite=Strict, Max-Age=15552000 (180 дней).
          Domain задаётся host-приложением обязательно. Secure/SameSite настраиваемы (Secure=true,
          SameSite=Strict по умолчанию; SameSite=None требует Secure=true). HttpOnly всегда включён.
        type: string
        example: RTID=02fb5463db25b91568a1801dc0974b1d50cb1f3bc817f2be3a4b357929cee704; Path=/; Domain=example.com; Max-Age=15552000; HttpOnly; Secure; SameSite=Strict
